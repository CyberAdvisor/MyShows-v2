// --- MSG-1: messages above the list ------------------------------------

var SAVE_FAILED_TEXT = 'Could not save on this device. Storage may be full or private browsing is on.';

// Adds a message, unless the same one is already showing.
function addNotice(text) {
  if (state.notices.indexOf(text) === -1) state.notices.push(text);
}

// The save message (while saving fails) and each notice with its ✕.
function noticesHtml() {
  var html = state.saveFailed ? '<p class="error-text" id="save-failed">' + SAVE_FAILED_TEXT + '</p>' : '';
  state.notices.forEach(function (text, i) {
    html += '<div class="notice"><p>' + escapeHtml(text) + '</p>' +
      '<button class="icon-btn notice-dismiss" data-notice="' + i + '" aria-label="Dismiss">\u2715</button></div>';
  });
  return html;
}

// Wires the ✕ buttons; dismissing redraws only the messages.
function bindNotices() {
  document.querySelectorAll('.notice-dismiss').forEach(function (b) {
    b.onclick = function () {
      state.notices.splice(Number(b.getAttribute('data-notice')), 1);
      document.getElementById('notices').innerHTML = noticesHtml();
      bindNotices();
    };
  });
}

// LOAD-7: names every failed show; Retry reloads the temporary ones.
function loadBannerHtml(failedEntries) {
  if (failedEntries.length === 0) return '';
  function names(kind) {
    return failedEntries.filter(function (e) { return e.failure === kind; })
      .map(function (e) { return escapeHtml(e.show.name); }).join(', ');
  }
  var temporary = names('temporary');
  var gone = names('gone');
  var changed = names('changed');
  var html = '<div class="load-banner" id="load-banner">';
  if (temporary) html += '<p>Couldn’t load: ' + temporary + '</p>';
  if (gone) html += '<p>No longer on TVmaze: ' + gone + ' — tap it below to delete</p>';
  if (changed) html += '<p>Episodes changed on TVmaze: ' + changed + ' — tap it below to fix</p>';
  if (temporary) html += '<button id="retry-failed-btn">Retry</button>';
  return html + '</div>';
}

// Rebuilds the banners, segment control and list (or search results) only.
function updateListBody() {
  var body = document.getElementById('list-body');
  if (!body) return;
  var entries = currentEntries();
  var failedEntries = buildFailedEntries(state.library, state.failed);
  // LOAD-15: shows being refetched keep their data, so only new ones count.
  var loadingCount = Object.keys(state.loading).filter(function (id) { return !state.computed[id]; }).length;
  var html = '';
  html += '<div id="notices">' + noticesHtml() + '</div>';
  html += loadBannerHtml(failedEntries);

  if (state.listQuery.trim()) {
    // SRCH-3/4: all segments, each row tagged with its group; failed shows
    // match by stored name (LOAD-10).
    var results = searchEntries(entries.concat(failedEntries), state.listQuery);
    html += '<p class="section-label">Results in all groups</p>';
    if (results.length === 0) {
      html += '<div class="empty">No shows match "' + escapeHtml(state.listQuery.trim()) + '"</div>';
    } else {
      html += '<div class="card-list">' + results.map(function (e) {
        return e.failure ? renderFailedRow(e, 'Couldn’t load') : renderRow(e, groupTagLabel(e.status));
      }).join('') + '</div>';
    }
    body.innerHTML = html;
    bindListBody(results);
    return;
  }

  var segments = buildSegments(entries);
  var counts = segmentCounts(segments);
  html += '<div class="segments" role="tablist">';
  ['watching', 'waiting', 'done'].forEach(function (key) {
    html += '<button role="tab" data-segment="' + key + '" class="' + (state.segment === key ? 'active' : '') + '">' +
      SEGMENT_LABELS[key] + '<span class="count">' + counts[key] + '</span></button>';
  });
  html += '</div>';

  // LOAD-8: say how many are still loading so they don't look missing.
  if (loadingCount) {
    html += '<p class="loading-line" id="loading-line">Loading ' + loadingCount + ' more show' + (loadingCount === 1 ? '' : 's') + '…</p>';
  }
  // LOAD-4: failed shows sit at the top of every segment.
  if (failedEntries.length) {
    html += '<p class="section-label">Couldn’t load</p><div class="card-list" id="failed-list">' +
      failedEntries.map(function (e) { return renderFailedRow(e); }).join('') + '</div>';
  }

  var shown;
  if (state.segment === 'watching') {
    shown = segments.running.concat(segments.binging);
    html += sectionHtml('Currently running shows', segments.running);
    html += sectionHtml('Ended shows I\'m binging', segments.binging);
  } else if (state.segment === 'waiting') {
    shown = segments.waiting.concat(segments.suspended);
    html += sectionHtml('Waiting for next episode or season', segments.waiting);
    html += sectionHtml('Suspended', segments.suspended);
  } else {
    shown = segments[state.segment];
    html += sectionHtml('', shown);
  }
  if (shown.length === 0 && !loadingCount) html += '<div class="empty">' + EMPTY_TEXT[state.segment] + '</div>';

  body.innerHTML = html;
  body.querySelectorAll('.segments button').forEach(function (b) {
    b.onclick = function () { state.segment = b.getAttribute('data-segment'); updateListBody(); };
  });
  bindListBody(failedEntries.concat(shown));
}

// Wires the rows and the banner's Retry button in the list body.
function bindListBody(entries) {
  bindRows(entries);
  bindNotices();
  var retry = document.getElementById('retry-failed-btn');
  if (retry) retry.onclick = function () { retryFailedShows(); updateListBody(); };
}

// A titled card list; omitted entirely when empty (LIST-11, LIST-14).
function sectionHtml(label, entries) {
  if (entries.length === 0) return '';
  return (label ? '<p class="section-label">' + label + '</p>' : '<div style="height:12px"></div>') +
    '<div class="card-list">' + entries.map(function (e) { return renderRow(e); }).join('') + '</div>';
}

// One show row - same content as V1 (LIST-5), plus an optional group tag
// for search results (SRCH-4).
function renderRow(e, tag) {
  var item = e.item, show = e.show, status = e.status;
  var platformText = item.platform ? ' <span class="platform">- ' + escapeHtml(item.platform) + '</span>' : '';
  var tagHtml = tag ? '<span class="group-tag">' + escapeHtml(tag) + '</span>' : '';
  var titleHtml = '<p class="row-title">' + escapeHtml(show.name) + platformText + tagHtml + '</p>';

  var subText;
  if (status.archived) {
    subText = 'Archived' + (item.archivedAt ? ' ' + formatDate(item.archivedAt) : '');
  } else if (status.nextEpisode) {
    subText = formatEpisodeCode(status.nextEpisode) + (status.nextEpisode.name ? ' - ' + escapeHtml(status.nextEpisode.name) : '');
  } else if (status.group === 'completed') {
    subText = 'All episodes watched';
  } else {
    subText = 'Renewed - no date yet';
  }

  var right = '';
  if (status.group === 'available') {
    right = '<button class="text" id="mark-' + item.showId + '">Mark watched</button>';
  } else if (status.group === 'upcoming') {
    right = '<span class="row-right">' + formatCountdown(status.daysUntil, status.nextEpisode.airdate) + '</span>';
  } else if (status.archived) {
    right = '<button class="text" id="reactivate-' + item.showId + '">Reactivate</button>';
  }

  var rowClass = item.showId === state.justAddedShowId ? 'row just-added' : 'row';
  return '<div class="' + rowClass + '" id="row-' + item.showId + '">' +
    '<div>' + titleHtml + '<p class="row-sub">' + subText + '</p></div>' +
    '<div class="row-right">' + right + '</div>' +
    '</div>';
}

// LOAD-4: a show whose TVmaze data couldn't be loaded - stored name (or
// TVmaze id), platform, and what tapping it does.
var FAILED_ROW_TEXT = {
  temporary: 'Couldn’t load — tap to retry',
  gone: 'No longer on TVmaze — tap to delete',
  changed: 'Episodes changed on TVmaze — tap to fix'
};

function renderFailedRow(e, tag) {
  var item = e.item;
  var platformText = item.platform ? ' <span class="platform">- ' + escapeHtml(item.platform) + '</span>' : '';
  var tagHtml = tag ? '<span class="group-tag">' + escapeHtml(tag) + '</span>' : '';
  return '<div class="row failed-row" id="row-' + item.showId + '">' +
    '<div><p class="row-title">' + escapeHtml(e.show.name) + platformText + tagHtml + '</p>' +
    '<p class="row-sub failed-sub">' + FAILED_ROW_TEXT[e.failure] + '</p></div>' +
    '<div class="row-right">›</div></div>';
}

function bindRows(entries) {
  entries.forEach(function (e) {
    var id = e.item.showId;
    var rowEl = document.getElementById('row-' + id);
    if (!rowEl) return;
    rowEl.onclick = function () { openDetail(id); };
    var markBtn = document.getElementById('mark-' + id);
    if (markBtn) markBtn.onclick = function (ev) { ev.stopPropagation(); markWatched(id); };
    var reactivateBtn = document.getElementById('reactivate-' + id);
    if (reactivateBtn) reactivateBtn.onclick = function (ev) { ev.stopPropagation(); reactivateShow(id); };
  });
}

// --- Show detail (DET-1: same as V1) ----------------------------------------

// LOAD-6: the screen for a show that couldn't be loaded. Temporary
// failures offer Retry; gone shows offer Delete series (as DET-3).
var FAILED_SCREEN_TEXT = {
  temporary: 'This show’s details couldn’t be loaded from TVmaze right now. Your place in the show is kept.',
  gone: 'TVmaze no longer has this show, so its episodes can’t be tracked. If it was replaced by a new listing, delete it and add the show again with Add Show.',
  changed: 'TVmaze changed this show’s episode list, and the last episode you watched can no longer be found. To fix it, delete the show and add it again with Add Show, choosing “Season/Episode last watched”.'
};

function renderFailedDetail(item) {
  var fs = state.failedScreen;
  var busy = fs.busy || !!state.loading[item.showId];
  var failure = state.failed[item.showId] || 'temporary'; // while retrying, it is no longer marked
  var html = appHeaderHtml();
  html += screenTitleHtml(storedShowName(item), true);
  if (item.platform) {
    html += '<p class="field-label">Watching on</p><p style="margin:0 0 16px; font-size:15px;">' + escapeHtml(item.platform) + '</p>';
  }
  html += '<p class="synopsis" id="failed-message">' + FAILED_SCREEN_TEXT[failure] + '</p>';
  if (failure === 'changed') {
    // LOAD-13: where they were, so they can add it back at the same place.
    html += '<p class="field-label">Last episode you watched</p><p style="margin:0 0 16px; font-size:15px;" id="last-watched-code">' +
      escapeHtml(item.watchedCode || 'Not recorded') + '</p>';
  }
  if (failure === 'gone' || failure === 'changed') {
    html += '<button class="wide danger" id="failed-delete-btn">Delete series</button>';
  } else {
    html += '<button class="primary" id="failed-retry-btn"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Retrying…' : 'Retry') + '</button>';
    if (fs.error) html += '<p class="error-text" style="margin-top:12px;">' + escapeHtml(fs.error) + '</p>';
  }
  root.innerHTML = html;
  bindChrome(openList);
  var del = document.getElementById('failed-delete-btn');
  if (del) del.onclick = function () { removeShow(item.showId); };
  var retry = document.getElementById('failed-retry-btn');
  if (retry) retry.onclick = function () { retryFromFailedScreen(item.showId); };
}

function renderDetail() {
  var item = state.library.find(function (i) { return i.showId === state.detailShowId; });
  var c = state.computed[state.detailShowId];
  if (item && !c && (state.failed[item.showId] || state.loading[item.showId])) return renderFailedDetail(item);
  if (!item || !c) { state.view = 'list'; return render(); }

  var status = withArchiveOverride(c.status, item.archived);
  var ep = status.nextEpisode;

  var html = appHeaderHtml();
  html += '<div class="top-bar"><button class="icon-btn" id="back-btn" aria-label="Back" style="padding-left:0;">&larr;</button></div>';

  if (ep && ep.image && ep.image.medium) {
    html += '<img class="episode-image" src="' + escapeHtml(ep.image.medium) + '" alt="" />';
  }

  html += '<h1 style="margin-bottom:2px;">' + escapeHtml(c.show.name) + '</h1>';

  if (ep) {
    html += '<p class="row-sub" style="margin-bottom:16px;">' + formatEpisodeCode(ep) + (ep.name ? ' - ' + escapeHtml(ep.name) : '') + '</p>';
  } else if (status.archived) {
    html += '<p class="row-sub" style="margin-bottom:16px;">Archived' + (item.archivedAt ? ' ' + formatDate(item.archivedAt) : '') + '</p>';
  } else {
    html += '<p class="row-sub" style="margin-bottom:16px;">' + (status.group === 'completed' ? 'All episodes watched' : 'Renewed - no date yet') + '</p>';
  }

  if (item.platform) {
    html += '<p class="field-label">Watching on</p><p style="margin:0 0 16px; font-size:15px;">' + escapeHtml(item.platform) + '</p>';
  }

  if (ep) {
    html += '<table class="detail-table">';
    html += '<tr><td>Air date</td><td>' + (ep.airdate ? formatDate(ep.airdate) : 'Unannounced') + '</td></tr>';
    if (ep.runtime) html += '<tr><td>Runtime</td><td>' + ep.runtime + ' min</td></tr>';
    html += '<tr><td>Season</td><td>' + ep.season + '</td></tr>';
    html += '<tr><td>Episodes left in season</td><td>' + episodesLeftInSeason(c.episodes, ep) + '</td></tr>';
    var seasonsInfo = seasonsRemaining(c.episodes, ep);
    html += '<tr><td>Seasons remaining</td><td>' + seasonsInfo.remaining + ' of ' + seasonsInfo.total + '</td></tr>';
    html += '</table>';

    var summary = stripHtml(ep.summary);
    html += '<p class="field-label" style="margin-top:16px;">Synopsis</p>';
    html += '<p class="synopsis">' + escapeHtml(summary || 'No synopsis available.') + '</p>';

    if (status.group === 'available') {
      html += '<button class="primary" id="mark-watched-btn">Mark watched</button>';
    }
  } else if (status.archived && item.archivedSnapshot) {
    var snap = item.archivedSnapshot;
    html += '<table class="detail-table">';
    html += '<tr><td>Last watched</td><td>' + escapeHtml(snap.lastWatchedCode) + '</td></tr>';
    html += '<tr><td>Episodes left in season</td><td>' + snap.episodesLeftInSeason + '</td></tr>';
    html += '<tr><td>Seasons remaining</td><td>' + snap.seasonsRemaining.remaining + ' of ' + snap.seasonsRemaining.total + '</td></tr>';
    html += '<tr><td>Archived on</td><td>' + (item.archivedAt ? formatDate(item.archivedAt) : 'Unknown') + '</td></tr>';
    html += '</table>';
  }

  // DET-6: move your place back or forward one episode (not while suspended).
  if (!status.archived && c.episodes.length) {
    var canBack = stepWatchedEpisode(c.episodes, item.watchedEpisodeId, -1) !== undefined;
    var canNext = stepWatchedEpisode(c.episodes, item.watchedEpisodeId, 1) !== undefined;
    html += '<div class="step-row">' +
      '<button id="prev-episode-btn"' + (canBack ? '' : ' disabled') + '>\u2039 Previous episode</button>' +
      '<button id="next-episode-btn"' + (canNext ? '' : ' disabled') + '>Next episode \u203A</button></div>';
    html += '<p class="hint" style="text-align:center;">Moves where you\u2019re up to back or forward one episode.</p>';
  }

  html += '<p style="margin-top:24px; text-align:center;">';
  if (status.archived) {
    html += '<a href="#" class="text-link" id="reactivate-link">Reactivate series</a>';
  } else {
    html += '<a href="#" class="text-link" id="end-series-link">Suspend series</a>';
  }
  html += ' &middot; <a href="#" class="remove-link" id="remove-link">Delete series</a></p>';

  root.innerHTML = html;
  bindChrome(openList);
  var markBtn = document.getElementById('mark-watched-btn');
  if (markBtn) markBtn.onclick = function () { markWatched(item.showId, true); };
  var prevBtn = document.getElementById('prev-episode-btn');
  if (prevBtn) prevBtn.onclick = function () { stepEpisode(item.showId, -1); };
  var nextBtn = document.getElementById('next-episode-btn');
  if (nextBtn) nextBtn.onclick = function () { stepEpisode(item.showId, 1); };
  document.getElementById('remove-link').onclick = function (ev) { ev.preventDefault(); removeShow(item.showId); };
  var endLink = document.getElementById('end-series-link');
  if (endLink) endLink.onclick = function (ev) { ev.preventDefault(); endSeries(item.showId); };
  var reactivateLink = document.getElementById('reactivate-link');
  if (reactivateLink) reactivateLink.onclick = function (ev) { ev.preventDefault(); reactivateShow(item.showId); };
}

// --- Add Show (ADD: V1 form, auto placement) --------------------------------

function freshAddFlow() {
  return { query: '', results: [], selected: null, platform: '', progress: 'caughtup', season: '', episode: '', error: '', searchStatus: 'idle', searchError: '', busy: false };
}

// "In Watching" etc. for a search result already in the library (ADD-6).
function libraryLabelFor(showId) {
  if (!state.library.some(function (i) { return i.showId === showId; })) return '';
  var entry = currentEntries().find(function (e) { return e.item.showId === showId; });
  if (!entry) return 'In your list';
  var label = groupTagLabel(entry.status);
  return label === 'Suspended' ? 'Suspended' : 'In ' + label;
}

function searchResultsHtml() {
  var af = state.addFlow;
  if (af.searchStatus === 'error') {
    return '<p class="error-text" style="margin-top:10px;">' + escapeHtml(af.searchError) + '</p>';
  }
  if (af.searchStatus === 'empty') {
    return '<p class="hint" style="margin-top:10px;">No shows found for "' + escapeHtml(af.query) + '".</p>';
  }
  if (af.results.length === 0) return '';

  var html = '<div style="margin-top:10px;">';
  af.results.forEach(function (r) {
    var s = r.show;
    var inLibrary = libraryLabelFor(s.id);
    var selected = af.selected && af.selected.id === s.id;
    var year = s.premiered ? s.premiered.slice(0, 4) : '';
    var network = (s.network && s.network.name) || (s.webChannel && s.webChannel.name) || '';
    html += '<div class="search-result' + (selected ? ' selected' : '') + (inLibrary ? ' in-library' : '') + '" data-id="' + s.id + '">';
    html += s.image ? '<img src="' + escapeHtml(s.image.medium) + '" alt="" />' : '<div style="width:36px;height:50px;flex-shrink:0;"></div>';
    html += '<div><p class="search-result-name">' + escapeHtml(s.name) + (inLibrary ? '<span class="group-tag">' + escapeHtml(inLibrary) + '</span>' : '') + '</p>';
    html += '<p class="search-result-meta">' + escapeHtml([year, network].filter(Boolean).join(', ')) + '</p></div>';
    html += '</div>';
  });
  return html + '</div>';
}

function bindSearchResultClicks() {
  state.addFlow.results.forEach(function (r) {
    var node = document.querySelector('.search-result[data-id="' + r.show.id + '"]');
    if (!node || libraryLabelFor(r.show.id)) return;
    node.onclick = function () { state.addFlow.selected = r.show; renderAddForm(); updateSearchResults(); };
  });
}

// Updates only the results under the search input. Replacing the input
// while typing makes iOS Safari drop focus (V1 lesson, kept).
function updateSearchResults() {
  var container = document.getElementById('search-results-container');
  if (!container) return;
  container.innerHTML = searchResultsHtml();
  bindSearchResultClicks();
}

function renderAdd() {
  var af = state.addFlow;
  var html = appHeaderHtml();
  html += screenTitleHtml('Add show', false);
  html += '<p class="field-label">Search</p>';
  html += '<input type="text" id="search-input" placeholder="Show title" value="' + escapeHtml(af.query) + '" />';
  html += '<div id="search-results-container">' + searchResultsHtml() + '</div>';
  html += '<div id="add-form"></div>';
  root.innerHTML = html;
  bindChrome();

  var searchInput = document.getElementById('search-input');
  var searchTimer = null;
  searchInput.oninput = function (e) {
    af.query = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      if (af.query.trim().length < 2) {
        af.results = [];
        af.searchStatus = 'idle';
        updateSearchResults();
        return;
      }
      searchShows(af.query).then(function (results) {
        af.results = results.slice(0, 8);
        af.searchStatus = af.results.length === 0 ? 'empty' : 'results';
        updateSearchResults();
      }).catch(function (err) {
        af.results = [];
        af.searchStatus = 'error';
        af.searchError = searchErrorText(err); // ADD-10
        updateSearchResults();
      });
    }, 350);
  };
  bindSearchResultClicks();
  renderAddForm();
}

// ADD-8 choices, in the order shown. Caught Up is the default (freshAddFlow).
var PROGRESS_CHOICES = [
  { value: 'starting', label: 'Starting' },
  { value: 'lastwatched', label: 'Season/Episode last watched' },
  { value: 'caughtup', label: 'Caught Up' }
];

// Platform (required, ADD-7), "Where are you up to?" (ADD-8) and the Add
// button for the selected result. Season/Episode fields show only for that choice.
function renderAddForm() {
  var af = state.addFlow;
  var form = document.getElementById('add-form');
  if (!form) return;
  if (!af.selected) { form.innerHTML = ''; return; }
  var html = '<div class="field" style="margin-top:16px;">';
  html += '<p class="field-label">Watching on (required)</p>';
  html += '<input type="text" id="platform-input" placeholder="e.g. Hulu, Netflix" value="' + escapeHtml(af.platform) + '" />';
  html += '</div>';
  html += '<p class="field-label">Where are you up to?</p><div class="field">';
  PROGRESS_CHOICES.forEach(function (c) {
    html += '<label class="progress-choice"><input type="radio" name="progress" value="' + c.value + '"' + (af.progress === c.value ? ' checked' : '') + ' /><span>' + c.label + '</span></label>';
    // Season/Episode sit directly under their own choice, only when it's picked.
    if (c.value === 'lastwatched' && af.progress === 'lastwatched') {
      html += '<div class="field-row partway-fields">';
      html += '<div class="field"><p class="hint" style="margin:0 0 4px;">Season</p><input type="number" id="season-input" min="0" value="' + escapeHtml(af.season) + '" /></div>';
      html += '<div class="field"><p class="hint" style="margin:0 0 4px;">Episode</p><input type="number" id="episode-input" min="0" value="' + escapeHtml(af.episode) + '" /></div>';
      html += '</div>';
    }
  });
  html += '</div>';
  if (af.error) html += '<p class="error-text" id="add-error" style="margin-bottom:10px;">' + escapeHtml(af.error) + '</p>';
  html += '<button class="primary" id="submit-add-btn"' + (af.busy ? ' disabled' : '') + '>' + (af.busy ? 'Adding…' : 'Add show') + '</button>';
  form.innerHTML = html;

  document.getElementById('platform-input').oninput = function (e) { af.platform = e.target.value; clearAddError(); };
  form.querySelectorAll('input[name="progress"]').forEach(function (r) {
    r.onchange = function () { af.progress = r.value; af.error = ''; renderAddForm(); };
  });
  var season = document.getElementById('season-input');
  if (season) season.oninput = function (e) { af.season = e.target.value; clearAddError(); };
  var episode = document.getElementById('episode-input');
  if (episode) episode.oninput = function (e) { af.episode = e.target.value; clearAddError(); };
  document.getElementById('submit-add-btn').onclick = submitAddShow;
}

// Removes the add-form error once the user starts fixing it, without
// re-rendering (that would replace the input and drop focus on iOS).
function clearAddError() {
  state.addFlow.error = '';
  var el = document.getElementById('add-error');
  if (el) el.parentNode.removeChild(el);
}

// Checks the add form; returns an error message, or '' when it can be added.
function addFormError(af) {
  if (state.library.some(function (i) { return i.showId === af.selected.id; })) return 'That show is already in your library.';
  if (!af.platform.trim()) return 'Enter where you’re watching it.';
  if (af.progress === 'lastwatched' && (af.season === '' || af.episode === '')) return 'Enter the season and episode you last watched.';
  return '';
}

function submitAddShow() {
  var af = state.addFlow;
  af.error = addFormError(af);
  if (af.error) { renderAddForm(); return; }

  var newItem = { showId: af.selected.id, name: af.selected.name, platform: af.platform.trim(), watchedEpisodeId: null };
  if (af.progress === 'caughtup') newItem.pendingCaughtUp = true;
  if (af.progress === 'lastwatched') newItem.pendingSeasonNumber = { season: parseInt(af.season, 10), number: parseInt(af.episode, 10) };
  var name = af.selected.name;

  state.library.push(newItem);
  saveLibrary(state.library);
  af.busy = true;
  renderAddForm();

  // ADD-3/ADD-5: place by computed status, show that segment, highlight the row.
  refreshComputedFor([newItem], { isNewAddition: true }).then(function () {
    var c = state.computed[newItem.showId];
    state.listQuery = '';
    state.view = 'list';
    if (c) {
      state.segment = displaySegment(withArchiveOverride(c.status, newItem.archived));
      state.justAddedShowId = newItem.showId;
      render();
      showToast(name + ' added to ' + SEGMENT_LABELS[state.segment]);
      clearTimeout(justAddedTimer);
      justAddedTimer = setTimeout(clearJustAdded, CONFIRM_MS);
    } else {
      render();
      showToast(name + ' was added, but its episode details couldn’t be loaded.');
    }
  });
}

var justAddedTimer = null;

// Ends the ADD-5 row highlight without redrawing the screen.
function clearJustAdded() {
  var row = document.getElementById('row-' + state.justAddedShowId);
  if (row) row.classList.remove('just-added');
  state.justAddedShowId = null;
}

// --- Settings › Sync (SET-3, SYN-6, SYN-8, GST-10, mockup 5.12) ---------------

function renderSync() {
  var ui = state.syncUi;
  var s = sync.settings;
  var html = appHeaderHtml();
  html += screenTitleHtml('Sync', true);

  html += '<p class="status-line">' + (sync.status === 'synced' ? '✓ Connected' : escapeHtml(SYNC_LABELS[sync.status])) + '</p>';
  html += '<p class="row-sub" style="margin-bottom:4px;">Gist ' + escapeHtml(s.gistId.slice(0, 8)) + '…</p>';
  html += '<p class="hint" style="margin-bottom:16px;">Last synced: ' + escapeHtml(formatSyncTime(s.lastSyncedAt, Date.now())) + '</p>';
  if (sync.errorCode) {
    var retryText = sync.retryAt ? new Date(sync.retryAt).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '';
    html += '<p class="error-text" id="sync-error-text" style="margin-bottom:16px;">' + escapeHtml(describeSyncError(sync.errorCode === 'scope' ? 'token' : sync.errorCode, retryText)) + '</p>';
  }
  if (ui.message) html += '<p class="hint" style="margin-bottom:12px;">' + escapeHtml(ui.message) + '</p>';

  if (sync.errorCode === 'notfound') {
    html += '<button class="wide" id="recreate-btn"' + (ui.busy ? ' disabled' : '') + '>Recreate gist</button>';
  }
  html += '<button class="wide" id="sync-now-btn"' + (ui.busy ? ' disabled' : '') + '>Sync now</button>';

  if (ui.changingToken) {
    html += '<div class="field" style="margin-top:8px;"><p class="field-label">New token (classic, gist scope)</p>' +
      '<input type="password" id="new-token-input" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + escapeHtml(ui.token) + '" /></div>';
    html += '<div class="field-row"><button class="wide" id="save-token-btn"' + (ui.busy ? ' disabled' : '') + '>' + (ui.busy ? 'Checking…' : 'Save token') + '</button>' +
      '<button class="wide" id="cancel-token-btn">Cancel</button></div>';
  } else {
    html += '<button class="wide" id="change-token-btn">Change token</button>';
  }
  html += '<button class="wide danger" id="disconnect-btn" style="margin-top:16px;">Disconnect this device</button>';
  html += '<p class="hint">Removes your list from this device only. It stays in your GitHub gist.</p>';

  root.innerHTML = html;
  bindChrome(openSettings);
  document.getElementById('sync-now-btn').onclick = function () { ui.message = ''; syncNow(); };
  var recreate = document.getElementById('recreate-btn');
  if (recreate) recreate.onclick = recreateGist;
  var change = document.getElementById('change-token-btn');
  if (change) change.onclick = function () { ui.changingToken = true; ui.token = ''; ui.message = ''; renderSync(); };
  var tokenInput = document.getElementById('new-token-input');
  if (tokenInput) tokenInput.oninput = function (e) { ui.token = e.target.value; };
  var save = document.getElementById('save-token-btn');
  if (save) save.onclick = saveNewToken;
  var cancel = document.getElementById('cancel-token-btn');
  if (cancel) cancel.onclick = function () { ui.changingToken = false; ui.token = ''; renderSync(); };
  document.getElementById('disconnect-btn').onclick = function () {
    var ok = window.confirm('Disconnect this device?\n\nYour list will be removed from this device only. It stays in your GitHub gist, and connecting again with your token loads it back.');
    if (ok) disconnect();
  };
}

// Change token (SYN-8): the new token must reach the same gist.
function saveNewToken() {
  var ui = state.syncUi;
  var token = ui.token.trim();
  if (!token) return;
  ui.busy = true; ui.message = '';
  renderSync();
  checkToken(token)
    .then(function () { return readGist(token, sync.settings.gistId); })
    .then(function () {
      sync.settings.token = token;
      saveSyncSettings(sync.settings);
      sync.errorCode = '';
      ui.busy = false; ui.changingToken = false; ui.token = '';
      ui.message = 'Token updated.';
      syncNow();
      renderSync();
    })
    .catch(function (err) {
      ui.busy = false;
      ui.message = err && err.code === 'notfound'
        ? 'This token can’t reach your My Shows gist. Use a token from the same GitHub account.'
        : setupErrorText(err);
      renderSync();
    });
}

// GST-10: make a new gist from the list on this device.
function recreateGist() {
  var ui = state.syncUi;
  var s = sync.settings;
  ui.busy = true;
  renderSync();
  var updatedAt = nextTimestamp(Date.now(), s.lastLocalChangeAt);
  var payload = wrapPayload(state.library, updatedAt);
  enqueue(function () {
    return createGist(s.token, payload).then(function (gistId) {
      s.gistId = gistId;
      s.lastLocalChangeAt = updatedAt;
      s.lastSyncedAt = updatedAt;
      saveSyncSettings(s);
      ui.busy = false;
      ui.message = 'A new gist was created from the list on this device.';
      setSyncStatus('synced');
    }).catch(function (err) {
      ui.busy = false;
      handleSyncFailure(err);
    });
  });
}

// --- Backup & restore (SET-2, DATA-7) -------------------------------------------

function downloadBackupFile() {
  var updatedAt = (sync.settings && sync.settings.lastLocalChangeAt) || nextTimestamp(Date.now(), null);
  var data = JSON.stringify(wrapPayload(state.library, updatedAt), null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'my-shows-v2-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function handleRestoreFile(file) {
  var statusEl = document.getElementById('restore-status');
  var reader = new FileReader();
  reader.onload = function () {
    var result = parsePayloadText(reader.result);
    if (!result.ok && result.reason === 'v1') { importV1Backup(result.items, statusEl); return; }
    if (!result.ok) {
      statusEl.innerHTML = '<p class="error-text">That file does not look like a valid My Shows backup.</p>';
      return;
    }
    var ok = window.confirm('Replace your list with this backup?\n\nEvery show currently in My Shows will be replaced by the ' +
      result.payload.library.length + ' show(s) in the file, on all your devices once it syncs. This can’t be undone.');
    if (!ok) return;
    statusEl.innerHTML = '';
    state.library = result.payload.library;
    state.computed = {};
    state.failed = {};
    saveLibrary(state.library);
    state.view = 'list';
    render();
    refreshComputedFor(state.library);
  };
  reader.onerror = function () {
    statusEl.innerHTML = '<p class="error-text">Could not read that file.</p>';
  };
  reader.readAsText(file);
}

// SET-4: a V1 backup replaces the whole V2 list after confirmation, the
// same as a V2 restore. Shows that can't be imported are left out and
// listed afterwards with the reason.
function importV1Backup(items, statusEl) {
  var split = splitV1Backup(items);
  if (split.importable.length === 0 && split.skipped.length === 0) {
    statusEl.innerHTML = '<p class="error-text">That V1 backup has no shows in it.</p>';
    return;
  }
  var message = state.library.length === 0
    ? 'Import ' + split.importable.length + ' show(s) from your My Shows V1 backup?'
    : 'Replace your list with this My Shows V1 backup?\n\nEvery show currently in My Shows will be replaced by the ' +
      split.importable.length + ' show(s) that can be imported, on all your devices once it syncs. This can\u2019t be undone.';
  if (split.skipped.length) message += '\n\n' + split.skipped.length + ' show(s) can\u2019t be imported. They\u2019ll be listed next, with the reason, so you can add them again.';
  if (!window.confirm(message)) return;

  state.library = split.importable;
  state.computed = {};
  state.failed = {};
  saveLibrary(state.library);
  state.view = 'loading';
  render();
  var names = Promise.all(split.skipped.map(function (s) {
    return s.showId === null ? Promise.resolve(null) : fetchShowName(s.showId);
  }));
  Promise.all([refreshComputedFor(state.library), names]).then(function (results) {
    state.importReport = {
      imported: split.importable.length,
      skipped: split.skipped.map(function (s, i) {
        var name = results[1][i] || (s.showId === null ? 'Unknown show' : 'TVmaze show #' + s.showId);
        return { name: name, reason: V1_SKIP_REASONS[s.reason] };
      })
    };
    state.view = 'importreport';
    render();
  });
}

// SET-4 result: what was imported and which shows to add again, and why.
function renderImportReport() {
  var r = state.importReport;
  var html = appHeaderHtml();
  html += screenTitleHtml('V1 import', false);
  html += '<p class="status-line">\u2713 ' + r.imported + ' show' + (r.imported === 1 ? '' : 's') + ' imported.</p>';
  if (r.skipped.length) {
    html += '<p class="field-label" style="margin-top:16px;">Not imported \u2014 add these again with Add Show</p>';
    html += '<div class="card-list" id="skipped-list">';
    r.skipped.forEach(function (s) {
      html += '<div class="row" style="cursor:default;"><div><p class="row-title">' + escapeHtml(s.name) + '</p>' +
        '<p class="hint" style="margin:3px 0 0;">' + escapeHtml(s.reason) + '</p></div></div>';
    });
    html += '</div>';
  }
  html += '<button class="primary" id="report-done-btn" style="margin-top:20px;">Go to my shows</button>';
  root.innerHTML = html;
  bindChrome();
  document.getElementById('report-done-btn').onclick = function () { state.importReport = null; openList(); };
}

function renderBackup() {
  var html = appHeaderHtml();
  html += screenTitleHtml('Backup & restore', true);
  html += '<p class="field-label">Backup</p>';
  html += '<p class="hint" style="margin-bottom:8px;">Your list is already kept in your GitHub gist. A backup file is an extra copy you control.</p>';
  html += '<button id="download-backup-btn" style="width:100%;">Download backup file</button>';
  html += '<p class="field-label" style="margin-top:28px;">Restore</p>';
  html += '<p class="hint" style="margin-bottom:8px;">Pick a previously saved My Shows backup file, from V2 or V1.</p>';
  html += '<input type="file" id="restore-file-input" accept="application/json,.json" style="display:none;" />';
  html += '<button id="restore-file-btn" style="width:100%;">Choose backup file</button>';
  html += '<div id="restore-status"></div>';
  html += '<p class="hint" style="margin-top:8px;">Restoring replaces your whole list, on every device once it syncs.</p>';
  root.innerHTML = html;
  bindChrome(openSettings);
  document.getElementById('download-backup-btn').onclick = downloadBackupFile;
  document.getElementById('restore-file-btn').onclick = function () { document.getElementById('restore-file-input').click(); };
  document.getElementById('restore-file-input').onchange = function (e) {
    var file = e.target.files && e.target.files[0];
    if (file) handleRestoreFile(file);
  };
}

// ---------------------------------------------------------------------
// 8. Actions, data refresh, event wiring and init()
// ---------------------------------------------------------------------

function openList() { state.view = 'list'; render(); }
function openSettings() { state.view = 'settings'; render(); }
function openBackupFlow() { state.view = 'backup'; render(); }
function openSync() {
  state.syncUi = { changingToken: false, token: '', busy: false, message: '' };
  state.view = 'sync';
  render();
}
function openAddFlow() { state.addFlow = freshAddFlow(); state.view = 'add'; render(); }
function openDetail(showId) {
  state.detailShowId = showId;
  state.failedScreen = { busy: false, error: '' };
  state.view = 'detail';
  render();
}

function findItem(showId) { return state.library.find(function (i) { return i.showId === showId; }); }

function markWatched(showId, fromDetail) {
  var item = findItem(showId);
  var c = state.computed[showId];
  if (!item || !c || !c.status.nextEpisode) return;

  item.watchedEpisodeId = c.status.nextEpisode.id;
  c.status = computeShowStatus(c.show, c.episodes, item.watchedEpisodeId);
  // Still available afterwards: move to the bottom of Watching (V1 rule).
  if (c.status.group === 'available') item.availableOrder = nextBottomAvailableOrder(state.library);
  rememberWatchedCode(item, c.episodes);
  saveLibrary(state.library);

  if (fromDetail && !c.status.nextEpisode) state.view = 'list';
  render();
}

// DET-6: move the user's place one episode back or forward, stay on the
// detail screen, and confirm where they are now.
function stepEpisode(showId, direction) {
  var item = findItem(showId);
  var c = state.computed[showId];
  if (!item || !c || item.archived) return;
  var newId = stepWatchedEpisode(c.episodes, item.watchedEpisodeId, direction);
  if (newId === undefined) return;
  item.watchedEpisodeId = newId;
  c.status = computeShowStatus(c.show, c.episodes, item.watchedEpisodeId);
  rememberWatchedCode(item, c.episodes);
  saveLibrary(state.library);
  render();
  var ep = c.status.nextEpisode;
  showToast(ep ? 'Now up to ' + formatEpisodeCode(ep) + (ep.name ? ' - ' + ep.name : '')
               : 'Caught up on ' + c.show.name);
}

// DET-3: immediate and permanent, as in V1.
function removeShow(showId) {
  state.library = state.library.filter(function (i) { return i.showId !== showId; });
  delete state.computed[showId];
  delete state.failed[showId];
  saveLibrary(state.library);
  state.view = 'list';
  render();
}

// Suspend (DET-2): flag + frozen snapshot; progress is untouched.
function endSeries(showId) {
  var item = findItem(showId);
  var c = state.computed[showId];
  if (!item || !c) return;
  item.archived = true;
  item.archivedAt = localDateString(new Date()); // DATE-1
  item.archivedSnapshot = buildArchiveSnapshot(c.episodes, item.watchedEpisodeId, c.status.nextEpisode);
  saveLibrary(state.library);
  state.view = 'list';
  render();
}

function reactivateShow(showId) {
  var item = findItem(showId);
  if (!item) return;
  item.archived = false;
  delete item.archivedAt;
  delete item.archivedSnapshot;
  saveLibrary(state.library);
  render();
}

// Loads TVmaze data for the given items and computes their status.
// Resolves a typed season/episode into an episode id on first load.
// A show with no data that fails is recorded in state.failed (LOAD-3) and
// listed in the Couldn't load section; one that already has data keeps it
// (LOAD-15). A show whose last-watched episode has vanished from TVmaze is
// marked 'changed' (LOAD-12). state.loading tracks progress (LOAD-8).
// The list updates as each show settles.
function refreshComputedFor(items, options) {
  var isNewAddition = options && options.isNewAddition;
  return Promise.all(items.map(function (requested) {
    var showId = requested.showId;
    delete state.failed[showId];
    state.loading[showId] = true;
    return fetchShowWithEpisodes(showId).then(function (show) {
      // A sync may have replaced the library while this loaded: use the
      // current item, so its progress is the one computed and saved.
      var item = findItem(showId) || requested;
      var inLibrary = state.library.indexOf(item) !== -1;
      var episodes = sortedEpisodes(show._embedded && show._embedded.episodes ? show._embedded.episodes : []);
      var changed = false;

      if (item.pendingSeasonNumber) {
        var resolvedId = findEpisodeIdBySeasonNumber(episodes, item.pendingSeasonNumber.season, item.pendingSeasonNumber.number);
        if (resolvedId == null) {
          addNotice('Couldn\u2019t find season ' + item.pendingSeasonNumber.season + ' episode ' + item.pendingSeasonNumber.number + ' of ' + show.name +
            ' on TVmaze, so it starts from the beginning. If that\u2019s wrong, delete it and add it again.'); // ADD-9
        }
        item.watchedEpisodeId = resolvedId;
        delete item.pendingSeasonNumber;
        changed = true;
      }

      if (item.pendingCaughtUp) {
        item.watchedEpisodeId = lastAiredEpisodeId(episodes);
        delete item.pendingCaughtUp;
        changed = true;
      }

      // A name or last-watched code alone (LOAD-1, LOAD-13) is saved on this
      // device only: it must never make this device look newer than the
      // gist. It reaches the gist with the next real change. Only items
      // still in the library are saved (a sync may have removed it).
      var described = rememberShowName(item, show);

      if (progressLost(episodes, item.watchedEpisodeId)) {
        // LOAD-12: never treat the show as unstarted; the user fixes it.
        delete state.computed[showId];
        if (inLibrary) state.failed[showId] = 'changed';
        if (inLibrary && described) writeLocalLibrary(state.library);
        return;
      }

      var status = computeShowStatus(show, episodes, item.watchedEpisodeId);
      if (isNewAddition && status.group === 'available') {
        item.availableOrder = nextTopAvailableOrder(state.library);
        changed = true;
      }
      if (rememberWatchedCode(item, episodes)) described = true;
      state.computed[showId] = { show: show, episodes: episodes, status: status, loadedAt: Date.now() };
      if (inLibrary && changed) saveLibrary(state.library);
      else if (inLibrary && described) writeLocalLibrary(state.library);
    }).catch(function (err) {
      // LOAD-15: a show that already has data keeps it.
      if (findItem(showId) && !state.computed[showId]) state.failed[showId] = classifyLoadFailure(err);
    }).then(function () {
      delete state.loading[showId];
      onShowSettled(showId);
    });
  }));
}

// Redraws whatever shows load progress after one show finishes loading:
// the list body (never the search input, which iOS would drop focus from)
// or that show's screen.
function onShowSettled(showId) {
  if (state.view === 'list') updateListBody();
  else if (state.view === 'detail' && state.detailShowId === showId && !state.failedScreen.busy) render();
}

// LOAD-5/LOAD-6/LOAD-7/LOAD-11: loads the given shows again (default: every
// temporary failure). Resolves when they have all settled.
function retryFailedShows(showIds) {
  var ids = showIds || Object.keys(state.failed)
    .filter(function (id) { return state.failed[id] === 'temporary'; })
    .map(Number);
  var items = ids.map(findItem).filter(Boolean);
  return refreshComputedFor(items);
}

// LOAD-6: Retry on the failed-show screen. On success, back to the main
// display on the show's segment (as after adding, OD-10).
function retryFromFailedScreen(showId) {
  state.failedScreen = { busy: true, error: '' };
  render();
  retryFailedShows([showId]).then(function () {
    state.failedScreen = { busy: false, error: '' };
    var c = state.computed[showId];
    var item = findItem(showId);
    if (c && item) {
      state.segment = displaySegment(withArchiveOverride(c.status, item.archived));
      state.view = 'list';
      render();
      showToast(c.show.name + ' loaded');
      return;
    }
    if (state.view !== 'detail' || state.detailShowId !== showId) return;
    if (state.failed[showId] === 'temporary') {
      state.failedScreen.error = 'Still couldn’t load it. Check your connection, or try again later.';
    }
    render();
  });
}

// After the library is replaced by a pull: recompute cached shows,
// fetch any new ones (including ones that failed before), drop removed ones.
// Shows already loading are left to finish (they use the current item).
function refreshAfterLibraryChange() {
  var keep = {};
  var missing = [];
  var described = false;
  state.library.forEach(function (item) {
    keep[item.showId] = true;
    var c = state.computed[item.showId];
    // A pulled episode id not in the cached list may be newer TVmaze data
    // from another device: fetch again rather than compute (LOAD-12).
    if (c && !progressLost(c.episodes, item.watchedEpisodeId)) {
      c.status = computeShowStatus(c.show, c.episodes, item.watchedEpisodeId);
      if (rememberShowName(item, c.show)) described = true;
      if (rememberWatchedCode(item, c.episodes)) described = true;
    } else if (!state.loading[item.showId]) {
      missing.push(item);
    }
  });
  if (described) writeLocalLibrary(state.library); // LOAD-1, LOAD-13: device only
  Object.keys(state.computed).forEach(function (id) { if (!keep[id]) delete state.computed[id]; });
  Object.keys(state.failed).forEach(function (id) { if (!keep[id]) delete state.failed[id]; });
  return refreshComputedFor(missing);
}

// Redraws after a pull, without touching screens with a focused input.
function rerenderAfterSync() {
  var typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (state.view === 'list') {
    if (typing) updateListBody(); else render();
  } else if (state.view === 'detail' || state.view === 'settings' || (state.view === 'sync' && !typing)) {
    render();
  }
}

// OD-11: mark when a text field has focus; CSS hides the tool bar on
// touch screens, where that means the on-screen keyboard is open.
function isTextField(el) {
  return el && el.tagName === 'INPUT' && ['text', 'number', 'password', 'search'].indexOf(el.type) !== -1;
}
document.addEventListener('focusin', function (e) { if (isTextField(e.target)) document.body.classList.add('typing'); });
document.addEventListener('focusout', function (e) { if (isTextField(e.target)) document.body.classList.remove('typing'); });

// OD-6: pull whenever the app comes back to the foreground; also retry
// when the connection returns.
// LOAD-11: shows that couldn't load are also tried again on return, and
// LOAD-14: statuses are brought up to today and old data is refetched.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible' || !isConnected()) return;
  refreshOnReturn();
  if (!automaticSyncBlocked()) syncNow();
});

// LOAD-14 and LOAD-11: on return to the app, recompute every status for
// today's date, refetch shows loaded more than STALE_AFTER_MS ago (they
// stay listed meanwhile, LOAD-15), and retry temporary failures.
function refreshOnReturn() {
  var now = Date.now();
  var stale = [];
  state.library.forEach(function (item) {
    var c = state.computed[item.showId];
    if (!c) return;
    c.status = computeShowStatus(c.show, c.episodes, item.watchedEpisodeId);
    if (isStale(c.loadedAt, now, STALE_AFTER_MS) && !state.loading[item.showId]) stale.push(item);
  });
  if (state.view === 'list') updateListBody();
  else if (state.view === 'detail') render();
  return Promise.all([refreshComputedFor(stale), retryFailedShows()]);
}
window.addEventListener('online', function () {
  if (isConnected() && !automaticSyncBlocked()) syncNow();
});

function init() {
  sync.settings = loadSyncSettings();
  if (!isConnected()) {
    state.view = 'setup';
    render();
    return;
  }
  // GST-3: render from the working copy at once, then pull. Shows fill
  // in as their TVmaze data arrives (LOAD-8).
  var local = loadLocalLibrary();
  state.library = local.library;
  if (local.damaged) {
    // GST-20: a missing or damaged working copy must never be pushed over
    // the gist. Forgetting the last local change makes the pull win.
    sync.settings.lastLocalChangeAt = null;
    saveSyncSettings(sync.settings);
  }
  state.view = 'list';
  render();
  refreshComputedFor(state.library);
  syncNow();
}

init();
</script>
