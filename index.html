<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Shows</title>
<meta name="description" content="A free TV episode tracker that shows the next episode to watch for every show, and syncs your list across iPhone, iPad and Mac through your own GitHub Gist." />
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f7f7;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-muted: #9a9a9a;
    --accent: #0a66c2;
    --accent-bg: #e8f1fb;
    --danger: #c02020;
    --ok: #1d7a3a;
    --warn: #b26a00;
    --on-accent: #ffffff;  /* text on accent-coloured buttons */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --surface: #1c1c1c;
      --border: #333333;
      --text: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-muted: #777777;
      --accent: #6db2ff;
      --accent-bg: #16283b;
      --danger: #ff6b6b;
      --ok: #5fd07f;
      --warn: #f0b04a;
      --on-accent: #0b1a2b; /* dark text: white on light blue is hard to read */
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 96px);
    min-height: 100vh;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 12px 0 16px;
  }
  .section-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 20px 0 6px;
  }
  .card-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row:active { background: var(--accent-bg); }
  .row-title {
    font-size: 15px;
    font-weight: 500;
    margin: 0;
  }
  .row-title .platform {
    font-weight: 400;
    color: var(--text-secondary);
  }
  .row-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 3px 0 0;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .row-right {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    flex-shrink: 0;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  button:active { background: var(--accent-bg); }
  button:disabled { opacity: 0.6; }
  button.primary {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
    width: 100%;
    padding: 12px;
    font-size: 15px;
  }
  button.wide { width: 100%; margin-bottom: 10px; }
  button.danger { color: var(--danger); }
  button.text {
    border: none;
    background: none;
    color: var(--accent);
    padding: 4px 6px;
  }
  input[type="text"], input[type="number"], input[type="password"], input[type="search"] {
    font-family: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    width: 100%;
  }
  /* LIST-15: V1's "About My Shows & how to use" link under the list. */
  .about-link {
    display: block;
    text-align: center;
    margin: 36px 0 12px;
    color: var(--text-muted);
    font-size: 15px;
    text-decoration: underline;
  }
  .empty {
    text-align: center;
    color: var(--text-secondary);
    padding: 48px 20px;
    font-size: 15px;
    line-height: 1.6;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .icon-btn {
    border: none;
    background: none;
    font-size: 22px;
    line-height: 1;
    padding: 4px 8px;
    color: var(--accent);
  }
  .field-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 6px;
  }
  .field { margin-bottom: 16px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .hint { font-size: 12px; color: var(--text-muted); margin: 6px 0 0; line-height: 1.5; }
  .search-result {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .search-result img {
    width: 36px;
    height: 50px;
    object-fit: cover;
    border-radius: 4px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .search-result.selected {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .search-result.in-library { cursor: default; opacity: 0.75; }
  .search-result-name { font-size: 14px; font-weight: 500; margin: 0; }
  .search-result-meta { font-size: 12px; color: var(--text-secondary); margin: 2px 0 0; }
  .detail-table {
    width: 100%;
    font-size: 14px;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 14px;
  }
  .detail-table td { padding: 8px 0; }
  .detail-table td:first-child { color: var(--text-secondary); }
  .detail-table td:last-child { text-align: right; }
  .synopsis { font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  .episode-image {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
    display: block;
    background: var(--surface);
  }
  .error-text { color: var(--danger); font-size: 13px; margin: 6px 0 0; line-height: 1.5; }
  .loading { text-align: center; color: var(--text-secondary); padding: 40px; font-size: 14px; }
  .remove-link { color: var(--danger); font-size: 13px; }
  .text-link { color: var(--accent); font-size: 13px; }

  /* --- V2: header with wordmark and sync indicator (NAV-7, SYN-5) --- */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
  }
  .wordmark {
    border: none;
    background: none;
    padding: 4px 0;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }
  .version-link {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    margin: -2px 0 0;
  }
  .sync-ind {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    font-size: 12px;
    padding: 4px 10px;
    color: var(--text-secondary);
  }
  .sync-ind.synced { color: var(--ok); }
  .sync-ind.offline { color: var(--warn); }
  .sync-ind.error { color: var(--danger); border-color: var(--danger); }
  .screen-title { display: flex; align-items: center; gap: 4px; margin: 8px 0 12px; }
  .screen-title h1 { margin: 0; }
  .screen-title .icon-btn { padding-left: 0; }

  /* --- V2: selection boxes (LIST-1, LIST-4) --- */
  .segments {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 12px 0 4px;
  }
  .segments button {
    flex: 1;
    border: none;
    border-right: 1px solid var(--border);
    border-radius: 0;
    background: var(--surface);
    padding: 10px 4px;
    font-size: 14px;
    white-space: nowrap;
  }
  .segments button:last-child { border-right: none; }
  .segments button.active {
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }
  .segments .count { font-variant-numeric: tabular-nums; margin-left: 4px; }
  .group-tag {
    display: inline-block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--accent);
    margin-left: 6px;
  }
  .search-box { margin-top: 10px; }

  /* --- V2: settings list --- */
  .settings-row {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-radius: 0;
    background: none;
    font-size: inherit;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row .row-sub { font-family: inherit; }
  .status-line { font-size: 14px; margin: 0 0 6px; }
  .choice {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .choice input { margin-top: 3px; }

  /* --- V2: bottom tool bar (NAV-1) --- */
  #toolbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 10;
  }
  #toolbar .bar { max-width: 480px; margin: 0 auto; display: flex; }
  #toolbar button {
    flex: 1;
    border: none;
    border-radius: 0;
    background: none;
    padding: 12px 4px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  #toolbar button.active { color: var(--accent); font-weight: 600; }
  #toolbar.hidden { display: none; }
  /* OD-11: hide while the on-screen keyboard is up. Touch screens only, so a
     Mac or an iPad with a hardware keyboard keeps its tool bar. */
  @media (pointer: coarse) {
    body.typing #toolbar { display: none; }
  }

  /* --- V2: confirmation toast (ADD-5) --- */
  #toast {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
    max-width: 448px;
    margin: 0 auto;
    background: var(--text);
    color: var(--bg);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    z-index: 20;
    display: none;
  }
  #toast.show { display: block; }

  /* --- ADD-5: the newly added show's row is highlighted --- */
  .row.just-added { background: var(--accent-bg); box-shadow: inset 4px 0 0 var(--accent); }

  /* --- ADD-8: "Where are you up to?" --- */
  .progress-choice { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 15px; }
  .progress-choice input { margin-top: 3px; }
  .partway-fields { margin: 4px 0 0 26px; }

  /* --- DET-6: Previous / Next episode --- */
  .step-row { display: flex; gap: 10px; margin-top: 14px; }
  .step-row button { flex: 1; }

  /* --- §4.8: show load failures (LOAD-4, LOAD-7, LOAD-8) --- */
  .load-banner {
    border: 1px solid var(--danger);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 12px 0 0;
    font-size: 14px;
    line-height: 1.5;
    color: var(--danger);
  }
  .load-banner p { margin: 0 0 4px; }
  .load-banner button { margin-top: 6px; color: var(--danger); border-color: var(--danger); }
  .failed-sub { color: var(--danger); font-family: inherit; }
  .failed-row .row-right { font-size: 20px; color: var(--text-muted); }
  .loading-line { font-size: 13px; color: var(--text-muted); margin: 10px 0 0; }

  /* --- MSG-1: dismissible messages above the list --- */
  .notice {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 12px 0 0;
    padding: 10px 4px 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    font-size: 14px;
    line-height: 1.5;
  }
  .notice p { margin: 0; flex: 1; }
  .notice .icon-btn { font-size: 16px; color: var(--text-secondary); padding: 0 8px; }
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="toolbar" class="hidden"></div>

<script>
// =====================================================================
// My Shows V2 - single-file app. See CLAUDE.md for every requirement ID
// referenced below. Sections follow ARC-3:
//   1. Constants and storage keys
//   2. Pure logic (no DOM, no fetch) - also loaded by logic.test.js
//   3. Storage
//   4. TVmaze client
//   5. Gist client
//   6. Sync controller
//   7. Rendering
//   8. Event wiring and init()
// =====================================================================

// ---------------------------------------------------------------------
// 1. Constants and storage keys
// ---------------------------------------------------------------------

var LIBRARY_KEY = 'my-shows-library-v2';     // DATA-1: local working copy
var SYNC_KEY = 'my-shows-sync-v2';           // DATA-5: token, gist id, sync times
var GIST_FILENAME = 'myshows.json';          // GST-1
var GIST_DESCRIPTION = 'My Shows V2';        // GST-17
var APP_ID = 'myshows';                      // GST-1 "app" marker
var SCHEMA_VERSION = 1;                      // GST-1
var SYNC_DEBOUNCE_MS = 2000;                 // GST-4
var TVMAZE_API = 'https://api.tvmaze.com';
var GITHUB_API = 'https://api.github.com';
var TOKEN_HELP_URL = 'https://github.com/CyberAdvisor/MyShows-v2#creating-your-github-token';
var APP_VERSION = '2.8.1';                   // VER-1: must match the newest changelog entry
var CONFIRM_MS = 5000;                       // ADD-5: how long the add confirmation shows
var TVMAZE_MAX_REQUESTS = 20;                // LOAD-2: once TVmaze has refused a request (429), pace to about 20 requests...
var TVMAZE_WINDOW_MS = 10000;                // ...per 10 seconds, TVmaze's limit from one IP address
var TVMAZE_RETRY_MS = 10000;                 // LOAD-2: wait after a 429 with no Retry-After header
var TVMAZE_429_RETRIES = 2;                  // LOAD-2: automatic retries before a 429 counts as failed
var TVMAZE_TIMEOUT_MS = 20000;               // LOAD-16: a request unanswered this long is abandoned
var STALE_AFTER_MS = 12 * 60 * 60 * 1000;    // LOAD-14: refetch data older than this on return

// === PURE LOGIC START ===
// ---------------------------------------------------------------------
// 2. Pure logic. No DOM and no network: logic.test.js extracts the text
//    between the PURE LOGIC START/END markers and runs it on its own.
// ---------------------------------------------------------------------

// Zero-pads a season/episode number to two digits.
function pad(n) { return n < 10 ? '0' + n : '' + n; }

// DATE-1: a Date as YYYY-MM-DD in the device's local time zone. TVmaze air
// dates are local dates, so "today" must be too (UTC is a day ahead every
// evening in the Americas).
function localDateString(date) {
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
}

// Sorts TVmaze episodes (specials included) into broadcast order by airdate.
// Entries with no season at all are dropped. Unchanged from V1.
function sortedEpisodes(rawEpisodes) {
  return rawEpisodes
    .filter(function (e) { return e.season != null; })
    .slice()
    .sort(function (a, b) {
      if (a.airdate && b.airdate) {
        if (a.airdate !== b.airdate) return a.airdate.localeCompare(b.airdate);
        return (a.number == null ? Infinity : a.number) - (b.number == null ? Infinity : b.number);
      }
      if (a.airdate && !b.airdate) return -1;
      if (!a.airdate && b.airdate) return 1;
      return a.season - b.season || (a.number == null ? Infinity : a.number) - (b.number == null ? Infinity : b.number);
    });
}

// True for TVmaze specials, which have no episode number.
function isSpecial(episode) {
  return episode.number == null;
}

// "S04E03", or "S02 Special" for specials.
function formatEpisodeCode(episode) {
  var s = pad(episode.season);
  if (isSpecial(episode)) return 'S' + s + ' Special';
  return 'S' + s + 'E' + pad(episode.number);
}

// Index of the last watched episode in a sorted list, or -1.
// Progress is tracked by TVmaze episode id, never season/number, because
// several specials can share a season with no number (see CLAUDE.md DATA-2).
function findWatchedIndex(episodes, watchedEpisodeId) {
  if (watchedEpisodeId == null) return -1;
  return episodes.findIndex(function (e) { return e.id === watchedEpisodeId; });
}

// LOAD-12: true when the stored last-watched episode is no longer in
// TVmaze's list (TVmaze deleted or re-created it). Never started (null)
// is not lost.
function progressLost(episodes, watchedEpisodeId) {
  return watchedEpisodeId != null && findWatchedIndex(episodes, watchedEpisodeId) === -1;
}

// LOAD-13: keeps item.watchedCode ("S02E05") in step with its
// watchedEpisodeId, for display if the episode later vanishes (LOAD-12).
// Leaves it alone when the episode can't be found. Returns true when changed.
function rememberWatchedCode(item, episodes) {
  if (item.watchedEpisodeId == null) {
    if (item.watchedCode === undefined) return false;
    delete item.watchedCode;
    return true;
  }
  var idx = findWatchedIndex(episodes, item.watchedEpisodeId);
  if (idx === -1) return false;
  var code = formatEpisodeCode(episodes[idx]);
  if (item.watchedCode === code) return false;
  item.watchedCode = code;
  return true;
}

// LOAD-14: true when data loaded at `loadedAt` (ms) is older than `maxAgeMs`.
function isStale(loadedAt, now, maxAgeMs) {
  return !loadedAt || now - loadedAt > maxAgeMs;
}

// ADD-10: a failed Add Show search in plain words, with the technical
// detail in brackets. `err.status` is set for HTTP errors.
function searchErrorText(err) {
  var detail = err && err.message ? err.message : String(err);
  var status = err && err.status;
  var plain = !status ? 'Couldn\u2019t reach TVmaze. Check your connection and try again.'
    : status === 429 ? 'TVmaze is busy. Wait a moment and try again.'
    : 'TVmaze returned an error. Try again.';
  return plain + ' (' + detail + ')';
}

// Resolves a typed season/episode (regular episodes only) to its episode id.
function findEpisodeIdBySeasonNumber(episodes, season, number) {
  var match = episodes.find(function (e) { return e.season === season && e.number === number; });
  return match ? match.id : null;
}

// Computes the V1 status of a show: group is available | upcoming | pending |
// completed, plus the next episode to watch. For available it also gives
// what the Watching order needs (LIST-14): ended (the series has ended) and
// latestAiredDate (air date of the show's newest aired episode). For
// upcoming it gives days until the next episode airs.
function computeShowStatus(show, episodes, watchedEpisodeId, today) {
  today = today || localDateString(new Date());
  var watchedIdx = findWatchedIndex(episodes, watchedEpisodeId);
  var nextIdx = watchedIdx + 1;

  if (nextIdx >= episodes.length) {
    if (show.status === 'Ended') return { group: 'completed', nextEpisode: null };
    return { group: 'pending', nextEpisode: null };
  }

  var nextEpisode = episodes[nextIdx];
  if (!nextEpisode.airdate) return { group: 'pending', nextEpisode: nextEpisode };
  if (nextEpisode.airdate <= today) {
    var latestAiredDate = nextEpisode.airdate;
    episodes.forEach(function (e) { if (e.airdate && e.airdate <= today && e.airdate > latestAiredDate) latestAiredDate = e.airdate; });
    return { group: 'available', nextEpisode: nextEpisode, ended: show.status === 'Ended', latestAiredDate: latestAiredDate };
  }

  var daysUntil = Math.round(
    (new Date(nextEpisode.airdate + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000
  );
  return { group: 'upcoming', nextEpisode: nextEpisode, daysUntil: daysUntil };
}

// "Caught up" (ADD-8): id of the last episode, specials included, that has
// aired by `today` in a sorted list, or null when nothing has aired yet.
function lastAiredEpisodeId(episodes, today) {
  today = today || localDateString(new Date());
  var id = null;
  episodes.forEach(function (e) {
    if (e.airdate && e.airdate <= today) id = e.id;
  });
  return id;
}

// DET-6: the watchedEpisodeId after moving one episode back (-1) or
// forward (+1). Returns undefined when the move isn't possible (nothing
// watched to go back from, or no further episode to skip to). Moving back
// from the first episode returns null (nothing watched).
function stepWatchedEpisode(episodes, watchedEpisodeId, direction) {
  var idx = findWatchedIndex(episodes, watchedEpisodeId);
  if (direction < 0) {
    if (idx < 0) return undefined;
    return idx === 0 ? null : episodes[idx - 1].id;
  }
  return idx + 1 < episodes.length ? episodes[idx + 1].id : undefined;
}

// Value that places an item at the TOP of Watching (lower = higher up).
function nextTopAvailableOrder(items) {
  var values = items.map(function (i) { return i.availableOrder || 0; }).concat([0]);
  return Math.min.apply(null, values) - 1;
}

// Value that places an item at the BOTTOM of Watching.
function nextBottomAvailableOrder(items) {
  var values = items.map(function (i) { return i.availableOrder || 0; }).concat([0]);
  return Math.max.apply(null, values) + 1;
}

// Episodes remaining in the next episode's season, counting that episode.
function episodesLeftInSeason(episodes, nextEpisode) {
  if (!nextEpisode) return 0;
  var seasonEpisodes = episodes.filter(function (e) { return e.season === nextEpisode.season; });
  var idx = seasonEpisodes.findIndex(function (e) { return e.id === nextEpisode.id; });
  if (idx === -1) return 0;
  return seasonEpisodes.length - idx;
}

// { remaining, total }: seasons after the current one, out of all seasons.
function seasonsRemaining(episodes, nextEpisode) {
  var seasonNumbers = [];
  episodes.forEach(function (e) {
    if (seasonNumbers.indexOf(e.season) === -1) seasonNumbers.push(e.season);
  });
  if (!nextEpisode) return { remaining: 0, total: seasonNumbers.length };
  var remaining = seasonNumbers.filter(function (s) { return s > nextEpisode.season; }).length;
  return { remaining: remaining, total: seasonNumbers.length };
}

// Suspending ("archiving") is a user override layered on top of the real
// status, so resuming is a simple flag flip. Archived shows report
// group 'completed' with archived: true, exactly as in V1.
function withArchiveOverride(status, archived) {
  if (!archived) return status;
  return { group: 'completed', nextEpisode: null, archived: true };
}

// Frozen record of where a show stood at the moment it was suspended.
function buildArchiveSnapshot(episodes, watchedEpisodeId, nextEpisode) {
  var watchedIdx = findWatchedIndex(episodes, watchedEpisodeId);
  var lastWatchedEpisode = watchedIdx === -1 ? null : episodes[watchedIdx];
  return {
    lastWatchedCode: lastWatchedEpisode ? formatEpisodeCode(lastWatchedEpisode) : 'Not started',
    episodesLeftInSeason: episodesLeftInSeason(episodes, nextEpisode),
    seasonsRemaining: seasonsRemaining(episodes, nextEpisode)
  };
}

// "Today", "Tomorrow", "Fri, 3 days" or "Aug 20" for an upcoming air date.
function formatCountdown(daysUntil, airdate) {
  if (daysUntil === 0) return 'Today';
  if (daysUntil === 1) return 'Tomorrow';
  var d = new Date(airdate + 'T00:00:00');
  if (daysUntil <= 6) {
    return d.toLocaleDateString(undefined, { weekday: 'short' }) + ', ' + daysUntil + ' days';
  }
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

// --- V2 segments (LIST-6) -------------------------------------------

var SEGMENT_LABELS = { watching: 'Watching', waiting: 'Waiting', done: 'Done' };

// Maps a status (after the archive override) to watching | waiting |
// suspended | done. "suspended" is shown inside the Waiting segment.
function segmentForStatus(status) {
  if (status.archived) return 'suspended';
  if (status.group === 'available') return 'watching';
  if (status.group === 'completed') return 'done';
  return 'waiting'; // upcoming and pending
}

// The selection box a status belongs to: suspended shows sit under Waiting.
function displaySegment(status) {
  var seg = segmentForStatus(status);
  return seg === 'suspended' ? 'waiting' : seg;
}

// Short label for a show's group, used by search tags (SRCH-4) and the
// Add screen's "already in your list" marker (ADD-6).
function groupTagLabel(status) {
  var seg = segmentForStatus(status);
  return seg === 'suspended' ? 'Suspended' : SEGMENT_LABELS[seg];
}

function compareByName(a, b) { return a.show.name.localeCompare(b.show.name); }

// V1 sink order (availableOrder: added = top, marked watched = bottom).
function compareAvailableOrder(a, b) { return (a.availableOrder || 0) - (b.availableOrder || 0); }

// Splits entries ({ item, show, status, availableOrder }) into the lists
// the main display needs, each sorted. Watching is two sections (LIST-14):
//   running   - TVmaze status not Ended: newest released episode first
//   binging   - TVmaze status Ended: V1 sink order
// Waiting is two sections (LIST-11):
//   waiting   - soonest air date first, then "no date yet" shows A-Z (OD-12)
//   suspended - A-Z
// and done is A-Z.
function buildSegments(entries) {
  var out = { running: [], binging: [], waiting: [], suspended: [], done: [] };
  var upcoming = [], pending = [];
  entries.forEach(function (e) {
    var seg = segmentForStatus(e.status);
    if (seg === 'watching') {
      out[e.status.ended ? 'binging' : 'running'].push(e);
    } else if (seg === 'waiting') {
      (e.status.group === 'upcoming' ? upcoming : pending).push(e);
    } else {
      out[seg].push(e);
    }
  });
  out.running.sort(function (a, b) {
    return (b.status.latestAiredDate || '').localeCompare(a.status.latestAiredDate || '') || compareAvailableOrder(a, b);
  });
  out.binging.sort(compareAvailableOrder);
  upcoming.sort(function (a, b) {
    return a.status.nextEpisode.airdate.localeCompare(b.status.nextEpisode.airdate) || compareByName(a, b);
  });
  pending.sort(compareByName);
  out.waiting = upcoming.concat(pending);
  out.suspended.sort(compareByName);
  out.done.sort(compareByName);
  return out;
}

// Counts for the three selection boxes. Each counts both of its sections
// (Waiting includes Suspended, OD-16).
function segmentCounts(segments) {
  return {
    watching: segments.running.length + segments.binging.length,
    waiting: segments.waiting.length + segments.suspended.length,
    done: segments.done.length
  };
}

// Library search (SRCH-2): case-insensitive substring match on show name,
// across every segment (SRCH-3), results A-Z.
function searchEntries(entries, query) {
  var q = (query || '').trim().toLowerCase();
  if (!q) return [];
  return entries
    .filter(function (e) { return e.show.name.toLowerCase().indexOf(q) !== -1; })
    .sort(compareByName);
}

// --- Show load failures (§4.8) ------------------------------------------

// LOAD-3: 'gone' when TVmaze says the show doesn't exist (404); anything
// else (429 after retries, 5xx, no response, time limit, unreadable data)
// is 'temporary'. `err.status` is set by the TVmaze client for HTTP errors.
// The third kind, 'changed' (LOAD-12), is decided after a successful load.
function classifyLoadFailure(err) {
  return err && err.status === 404 ? 'gone' : 'temporary';
}

// LOAD-1/LOAD-4: the name to show for a library item whose TVmaze data
// isn't loaded - its stored name, or its TVmaze id if none is stored yet.
function storedShowName(item) {
  return item.name || 'TVmaze show #' + item.showId;
}

// LOAD-1: copies TVmaze's current name onto a library item. Returns true
// when the item changed (new or renamed), so the caller can save it.
function rememberShowName(item, show) {
  if (!show || typeof show.name !== 'string' || !show.name || item.name === show.name) return false;
  item.name = show.name;
  return true;
}

// LOAD-4: the Couldn't load section. `failed` maps showId -> 'temporary' |
// 'gone' | 'changed'. Entries are shaped like list entries (show.name) so search
// (LOAD-10) can match them, plus `failure`. Sorted A-Z.
function buildFailedEntries(library, failed) {
  return library
    .filter(function (item) { return failed[item.showId]; })
    .map(function (item) { return { item: item, show: { name: storedShowName(item) }, failure: failed[item.showId] }; })
    .sort(compareByName);
}

// LOAD-2: while pacing after a 429, how long to wait before the next TVmaze
// request so that no more than `max` start within any `windowMs`. `times` are the start times of
// earlier requests (same clock as `now`). 0 means go now.
function throttleDelay(times, now, max, windowMs) {
  var recent = times.filter(function (t) { return now - t < windowMs; });
  if (recent.length < max) return 0;
  return Math.max(1, recent[recent.length - max] + windowMs - now);
}

// --- V2 data validation (GST-2, GST-18, SET-2) --------------------------

function isPlainObject(v) {
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}

function isValidLibraryItem(item) {
  if (!isPlainObject(item)) return false;
  if (typeof item.showId !== 'number' || !isFinite(item.showId) || Math.floor(item.showId) !== item.showId) return false;
  if (item.platform !== undefined && typeof item.platform !== 'string') return false;
  if (item.watchedEpisodeId !== undefined && item.watchedEpisodeId !== null && typeof item.watchedEpisodeId !== 'number') return false;
  if (item.availableOrder !== undefined && typeof item.availableOrder !== 'number') return false;
  if (item.archived !== undefined && typeof item.archived !== 'boolean') return false;
  if (item.pendingCaughtUp !== undefined && typeof item.pendingCaughtUp !== 'boolean') return false;
  if (item.name !== undefined && typeof item.name !== 'string') return false;
  if (item.watchedCode !== undefined && typeof item.watchedCode !== 'string') return false;
  if (item.pendingSeasonNumber !== undefined && item.pendingSeasonNumber !== null) {
    var p = item.pendingSeasonNumber;
    if (!isPlainObject(p) || typeof p.season !== 'number' || typeof p.number !== 'number') return false;
  }
  return true;
}

// A whole library: an array of valid items with no duplicate showIds.
function isValidLibrary(library) {
  if (!Array.isArray(library)) return false;
  var seen = {};
  for (var i = 0; i < library.length; i++) {
    if (!isValidLibraryItem(library[i])) return false;
    if (seen[library[i].showId]) return false;
    seen[library[i].showId] = true;
  }
  return true;
}

// The wrapper used for both the gist file and backup files (GST-1, DATA-7).
function wrapPayload(library, updatedAt) {
  return { app: APP_ID, schemaVersion: SCHEMA_VERSION, updatedAt: updatedAt, library: library };
}

function isValidPayload(p) {
  return isPlainObject(p) &&
    p.app === APP_ID &&
    p.schemaVersion === SCHEMA_VERSION &&
    typeof p.updatedAt === 'string' && !isNaN(Date.parse(p.updatedAt)) &&
    isValidLibrary(p.library);
}

// Parses gist or backup text. Returns { ok: true, payload } or
// { ok: false, reason } where reason is 'json' (not JSON), 'v1' (a V1
// backup: a bare array, also returned as `items`) or 'shape' (JSON, but
// not a V2 payload).
function parsePayloadText(text) {
  var parsed;
  try { parsed = JSON.parse(text); } catch (e) { return { ok: false, reason: 'json' }; }
  if (Array.isArray(parsed)) return { ok: false, reason: 'v1', items: parsed };
  if (!isValidPayload(parsed)) return { ok: false, reason: 'shape' };
  return { ok: true, payload: parsed };
}

// --- V1 backup import (SET-4) ----------------------------------------------

// The DATA-2 fields copied from a V1 entry; anything else is left behind.
var V1_IMPORT_FIELDS = ['showId', 'platform', 'watchedEpisodeId', 'pendingSeasonNumber',
  'availableOrder', 'archived', 'archivedAt', 'archivedSnapshot'];

// Why a V1 entry can't be imported (shown to the user, SET-4).
var V1_SKIP_REASONS = {
  platform: 'No "Watching on" platform in the V1 backup (required in V2).',
  oldformat: 'Saved by an older version of V1 in a format V2 can\u2019t read.',
  invalid: 'This entry in the backup file is incomplete or damaged.'
};

// Splits V1 backup entries into { importable, skipped }. Importable entries
// are copied with only the DATA-2 fields and a trimmed platform. Skipped
// entries are { showId (number or null), reason } with a V1_SKIP_REASONS key.
// Repeated showIds are imported once.
function splitV1Backup(items) {
  var importable = [], skipped = [], seen = {};
  items.forEach(function (raw) {
    var showId = isPlainObject(raw) && typeof raw.showId === 'number' ? raw.showId : null;
    if (showId !== null && seen[showId]) return;
    if (isPlainObject(raw) && raw.watchedThrough !== undefined) { skipped.push({ showId: showId, reason: 'oldformat' }); return; }
    if (!isValidLibraryItem(raw)) { skipped.push({ showId: showId, reason: 'invalid' }); return; }
    if (!raw.platform || !raw.platform.trim()) { skipped.push({ showId: showId, reason: 'platform' }); return; }
    var item = {};
    V1_IMPORT_FIELDS.forEach(function (f) { if (raw[f] !== undefined) item[f] = raw[f]; });
    item.platform = raw.platform.trim();
    seen[showId] = true;
    importable.push(item);
  });
  return { importable: importable, skipped: skipped };
}

// --- V2 sync decisions (GST-3, GST-7) ------------------------------------

// Last-write-wins by ISO timestamp. Returns:
//   'pull' - the gist is newer than the last change made on this device
//   'push' - this device has a change the gist has not received
//   'none' - both sides already match
function decideSync(remoteUpdatedAt, lastLocalChangeAt, lastSyncedAt) {
  if (remoteUpdatedAt && (!lastLocalChangeAt || remoteUpdatedAt > lastLocalChangeAt)) return 'pull';
  if (lastLocalChangeAt && (!lastSyncedAt || lastLocalChangeAt > lastSyncedAt)) return 'push';
  return 'none';
}

// A timestamp that is always later than `previousIso`, so two changes in
// the same millisecond still compare as newer than each other.
function nextTimestamp(nowMs, previousIso) {
  var prev = previousIso ? Date.parse(previousIso) : 0;
  var t = nowMs > prev ? nowMs : prev + 1;
  return new Date(t).toISOString();
}

// From GitHub's gist list, the ids of gists holding a myshows.json file.
function findCandidateGistIds(gistList) {
  return gistList
    .filter(function (g) { return g && g.files && g.files[GIST_FILENAME]; })
    .map(function (g) { return g.id; });
}

// Splits fetched candidates ({ id, text }) into valid V2 lists and invalid
// ones (SYN-4). Valid ones are sorted newest first for the picker.
function classifyCandidates(candidates) {
  var valid = [], invalid = [];
  candidates.forEach(function (c) {
    var result = c.text == null ? { ok: false } : parsePayloadText(c.text);
    if (result.ok) valid.push({ id: c.id, payload: result.payload });
    else invalid.push(c.id);
  });
  valid.sort(function (a, b) { return b.payload.updatedAt.localeCompare(a.payload.updatedAt); });
  return { valid: valid, invalid: invalid };
}

// User-facing text for each sync error code (SYN-5, §7.3).
function describeSyncError(code, retryAtText) {
  switch (code) {
    case 'offline': return 'Offline — changes saved on this device. They will sync when you are back online.';
    case 'token': return 'Sync error — token rejected. Your GitHub token has expired, been revoked, or is missing the gist scope. Use Change token.';
    case 'notfound': return 'Sync error — gist not found. It may have been deleted on GitHub. Use Recreate gist to make a new one from the list on this device.';
    case 'malformed': return 'Sync error — your gist contains a file that is not a valid My Shows list. It was not applied; the list on this device is unchanged.';
    case 'invalid': return 'Sync error — the list on this device failed validation, so it was not uploaded. Your gist is unchanged.';
    case 'ratelimit': return 'GitHub’s rate limit was reached. Sync will try again' + (retryAtText ? ' after ' + retryAtText : ' later') + '.';
    default: return 'Sync error — GitHub returned an error. Sync will try again on your next change, or use Sync now.';
  }
}

// "just now", "5 min ago", or a clock time for older syncs.
function formatSyncTime(iso, nowMs) {
  if (!iso) return 'never';
  var diffMin = Math.floor((nowMs - Date.parse(iso)) / 60000);
  if (diffMin < 1) return 'just now';
  if (diffMin < 60) return diffMin + ' min ago';
  var d = new Date(iso);
  var sameDay = d.toDateString() === new Date(nowMs).toDateString();
  var time = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  return sameDay ? 'today ' + time : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + time;
}

// ---------------------------------------------------------------------
// 3. Storage. localStorage holds the working copy and the sync settings;
//    the gist is the source of truth (DATA-1). V1 keys are never read.
// ---------------------------------------------------------------------

function readJson(key) {
  try {
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

// Writes a value; state.saveFailed drives the MSG-1 save message, which
// clears itself once a save succeeds.
function writeJson(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    state.saveFailed = false;
    return true;
  } catch (e) {
    state.saveFailed = true;
    return false;
  }
}

// The local working copy as { library, damaged }. A missing or invalid
// copy gives an empty library with damaged: true (GST-20).
function loadLocalLibrary() {
  var lib = readJson(LIBRARY_KEY);
  return isValidLibrary(lib) ? { library: lib, damaged: false } : { library: [], damaged: true };
}

// Writes the working copy only. Used when the change came FROM the gist.
function writeLocalLibrary(library) {
  writeJson(LIBRARY_KEY, library);
}

// Every user change goes through here: saved on the device immediately,
// then a push to the gist is scheduled (ARC-5, GST-4).
function saveLibrary(library) {
  writeLocalLibrary(library);
  noteLocalChange();
}

// Sync settings (DATA-5). Their presence decides whether Setup shows.
function loadSyncSettings() {
  var s = readJson(SYNC_KEY);
  return s && typeof s.token === 'string' && s.token && typeof s.gistId === 'string' && s.gistId ? s : null;
}

function saveSyncSettings(settings) {
  writeJson(SYNC_KEY, settings);
}

// Disconnect (SYN-6): remove everything this app stores on the device.
function clearLocalData() {
  try {
    localStorage.removeItem(SYNC_KEY);
    localStorage.removeItem(LIBRARY_KEY);
  } catch (e) { /* nothing else to clear */ }
}

// ---------------------------------------------------------------------
// 4. TVmaze client (public API, no key). Every request goes through
//    tvmazeGet. Requests go out at once, so answers the browser already
//    has cached arrive immediately; only after TVmaze refuses one (429)
//    are requests paced to its rate limit, and the refused one is retried
//    automatically (LOAD-2).
// ---------------------------------------------------------------------

var tvmazeStarts = [];              // start times of recent requests (monotonic ms)
var tvmazeTurn = Promise.resolve(); // requests take their turn in order
var tvmazePacedUntil = 0;           // pace requests until this time (monotonic ms); 0 = not pacing

// Monotonic milliseconds, so pacing isn't affected by clock changes.
function monotonicNow() {
  return typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now();
}

function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

// Resolves when the next TVmaze request may start: at once normally, or
// when throttleDelay allows while pacing after a 429. Pacing lasts until a
// full window passes with no paced request, so a queue of retries drains
// at TVmaze's pace before requests go out freely again.
function tvmazeSlot() {
  function takeTurn() {
    var now = monotonicNow();
    tvmazeStarts = tvmazeStarts.filter(function (t) { return now - t < TVMAZE_WINDOW_MS; });
    if (now < tvmazePacedUntil) {
      var delay = throttleDelay(tvmazeStarts, now, TVMAZE_MAX_REQUESTS, TVMAZE_WINDOW_MS);
      if (delay > 0) return sleep(delay).then(takeTurn);
      tvmazePacedUntil = Math.max(tvmazePacedUntil, now + TVMAZE_WINDOW_MS);
    }
    tvmazeStarts.push(now);
  }
  tvmazeTurn = tvmazeTurn.then(takeTurn);
  return tvmazeTurn;
}

// Seconds from a Retry-After header as ms, or the default wait.
function retryAfterMs(response) {
  var secs = Number(response.headers && response.headers.get && response.headers.get('Retry-After'));
  return secs > 0 ? secs * 1000 : TVMAZE_RETRY_MS;
}

// fetch with a time limit (LOAD-16): rejects if no response arrives within
// TVMAZE_TIMEOUT_MS, and aborts the request where the browser supports it.
function fetchWithTimeout(url) {
  var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer;
  var timeout = new Promise(function (resolve, reject) {
    timer = setTimeout(function () {
      if (controller) controller.abort();
      reject(new Error('TVmaze did not answer within ' + Math.round(TVMAZE_TIMEOUT_MS / 1000) + ' seconds'));
    }, TVMAZE_TIMEOUT_MS);
  });
  var request = fetch(url, controller ? { signal: controller.signal } : undefined);
  return Promise.race([request, timeout]).then(
    function (r) { clearTimeout(timer); return r; },
    function (err) { clearTimeout(timer); throw err; });
}

// GET returning parsed JSON. HTTP errors reject with an Error whose
// `status` is the response code (LOAD-3). A 429 turns pacing on and is
// retried up to TVMAZE_429_RETRIES times after waiting first.
function tvmazeGet(path, attempt) {
  attempt = attempt || 0;
  return tvmazeSlot().then(function () { return fetchWithTimeout(TVMAZE_API + path); }).then(function (r) {
    if (r.status === 429) {
      var waitMs = retryAfterMs(r);
      tvmazePacedUntil = Math.max(tvmazePacedUntil, monotonicNow() + waitMs + TVMAZE_WINDOW_MS);
      if (attempt < TVMAZE_429_RETRIES) {
        return sleep(waitMs).then(function () { return tvmazeGet(path, attempt + 1); });
      }
    }
    if (!r.ok) {
      var err = new Error('TVmaze returned ' + r.status);
      err.status = r.status;
      throw err;
    }
    return r.json();
  });
}

function searchShows(query) {
  return tvmazeGet('/search/shows?q=' + encodeURIComponent(query));
}

// Just a show's name, for listing V1 entries that weren't imported.
// Resolves to null when it can't be looked up.
function fetchShowName(showId) {
  return tvmazeGet('/shows/' + showId)
    .then(function (show) { return show && show.name ? show.name : null; }, function () { return null; });
}

// Show info plus every episode. Uses ?specials=1 because ?embed=episodes
// silently drops specials.
function fetchShowWithEpisodes(showId) {
  return Promise.all([
    tvmazeGet('/shows/' + showId),
    tvmazeGet('/shows/' + showId + '/episodes?specials=1')
  ]).then(function (results) {
    var show = results[0];
    show._embedded = { episodes: results[1] };
    return show;
  });
}

// ---------------------------------------------------------------------
// 5. Gist client. Plain fetch against api.github.com (GST-16). Every
//    failure is turned into a GistError with one of these codes:
//    offline | token | scope | notfound | ratelimit | server
// ---------------------------------------------------------------------

function GistError(code, status, retryAt) {
  this.code = code;
  this.status = status || 0;
  this.retryAt = retryAt || 0;
}

// Classifies a non-OK GitHub response.
function errorFromResponse(res) {

  if (res.status === 429 || (res.status === 403 && remaining === '0')) {
    var reset = parseInt(res.headers.get('x-ratelimit-reset'), 10);
    var retryAfter = parseInt(res.headers.get('retry-after'), 10);
    var retryAt = reset ? reset * 1000 : Date.now() + (retryAfter ? retryAfter * 1000 : 60000);
    return new GistError('ratelimit', res.status, retryAt);
  }
  if (res.status === 401 || res.status === 403) return new GistError('token', res.status);
  if (res.status === 404) return new GistError('notfound', res.status);
  return new GistError('server', res.status);
}

// One authenticated GitHub request. Resolves to the Response when OK.
function githubRequest(method, path, token, body) {

    method: method,
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': 'Bearer ' + token

  if (body !== undefined) {
    options.headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(body);
  }
  return fetch(GITHUB_API + path, options).then(function (res) {
    if (!res.ok) throw errorFromResponse(res);
    return res;
  }, function () {
    throw new GistError('offline');
  });

// Checks a token (SYN-3). Rejects with 'token' for a bad token and 'scope'

    var scopes = res.headers.get('x-oauth-scopes');
    if (scopes !== null && scopes.split(',').map(function (s) { return s.trim(); }).indexOf('gist') === -1) {
      throw new GistError('scope');
    }

// Every gist id in the user's account holding myshows.json (all pages).
function listCandidateGistIds(token) {
  var ids = [];
  function page(n) {
    return githubRequest('GET', '/gists?per_page=100&page=' + n, token)
      .then(function (res) { return res.json(); })
      .then(function (list) {
        ids = ids.concat(findCandidateGistIds(list));
        if (list.length === 100 && n < 30) return page(n + 1);
        return ids;
      });

  return page(1);
}

// Reads one gist. Resolves to { id, text } where text is the myshows.json

function readGist(token, gistId) {
  return githubRequest('GET', '/gists/' + gistId, token)
    .then(function (res) { return res.json(); })
    .then(function (gist) {
      var file = gist.files && gist.files[GIST_FILENAME];
      if (!file) return { id: gistId, text: null };
      if (!file.truncated) return { id: gistId, text: file.content };
      // Large files are truncated in the API response; fetch the raw copy.
      return fetch(file.raw_url).then(function (r) {
        if (!r.ok) throw new GistError('server', r.status);
        return r.text();
      }, function () { throw new GistError('offline'); })
        .then(function (text) { return { id: gistId, text: text }; });
    });
}

// Creates the secret My Shows gist (GST-17). Resolves to its id.
function createGist(token, payload) {
  return githubRequest('POST', '/gists', token, {
    description: GIST_DESCRIPTION,
    public: false,
    files: { 'myshows.json': { content: JSON.stringify(payload, null, 2) } }
  }).then(function (res) { return res.json(); })
    .then(function (gist) { return gist.id; });
}

// Replaces myshows.json in an existing gist.
function writeGist(token, gistId, payload) {
  return githubRequest('PATCH', '/gists/' + gistId, token, {
    files: { 'myshows.json': { content: JSON.stringify(payload, null, 2) } }
  });
}

// ---------------------------------------------------------------------
// 6. Sync controller. Pull on load and on resume, push after every local
//    change (debounced), last-write-wins (§7.2). Work is queued so only
//    one GitHub exchange runs at a time.
// ---------------------------------------------------------------------

var sync = {
  settings: null,      // DATA-5 record, or null when not connected
  status: 'synced',    // synced | syncing | offline | error
  errorCode: '',       // see describeSyncError
  retryAt: 0,          // rate-limit retry time (ms)
  timer: null,         // debounce / retry timer
  queue: Promise.resolve()
};

function isConnected() { return !!sync.settings; }

// Runs fn after any sync work already in progress.
function enqueue(fn) {
  sync.queue = sync.queue.then(fn, fn);
  return sync.queue;
}

// Called by saveLibrary for every local change.
function noteLocalChange() {
  if (!isConnected()) return;
  sync.settings.lastLocalChangeAt = nextTimestamp(Date.now(), sync.settings.lastLocalChangeAt);
  saveSyncSettings(sync.settings);
  schedulePush();
}

// Automatic syncing stops after a rejected token until it is changed
// (GST-9) and waits out a rate limit (GST-11).
function automaticSyncBlocked() {
  return sync.errorCode === 'token' || sync.errorCode === 'scope';
}

function schedulePush() {
  if (automaticSyncBlocked()) return;
  clearTimeout(sync.timer);
  var wait = Math.max(SYNC_DEBOUNCE_MS, sync.retryAt - Date.now());
  sync.timer = setTimeout(function () { enqueue(pushStep); }, wait);
}

// Pull, then push if this device is newer (GST-3). Used on load, resume
// and Sync now.
function syncNow() {
  if (!isConnected()) return Promise.resolve();
  clearTimeout(sync.timer);
  return enqueue(pullStep);
}

function pullStep() {
  if (!isConnected()) return;
  if (Date.now() < sync.retryAt) { scheduleRetry(); return; }
  setSyncStatus('syncing');
  var s = sync.settings;
  return readGist(s.token, s.gistId).then(function (remote) {
    if (remote.text === null) throw new GistError('notfound');
    var parsed = parsePayloadText(remote.text);
    if (!parsed.ok) { setSyncError('malformed'); return; } // GST-12
    var action = decideSync(parsed.payload.updatedAt, s.lastLocalChangeAt, s.lastSyncedAt);
    if (action === 'pull') return applyRemote(parsed.payload);
    if (action === 'push') return pushStep();
    setSyncStatus('synced');
  }).catch(handleSyncFailure);
}

function pushStep() {
  if (!isConnected()) return;
  if (Date.now() < sync.retryAt) { scheduleRetry(); return; }
  // GST-18: never write a list that fails validation.
  if (!isValidLibrary(state.library)) { setSyncError('invalid'); return; }
  setSyncStatus('syncing');
  var s = sync.settings;
  var updatedAt = s.lastLocalChangeAt || nextTimestamp(Date.now(), null);
  var payload = wrapPayload(state.library, updatedAt);
  return writeGist(s.token, s.gistId, payload).then(function () {
    s.lastSyncedAt = updatedAt;
    if (!s.lastLocalChangeAt) s.lastLocalChangeAt = updatedAt;
    saveSyncSettings(s);
    setSyncStatus('synced');
  }).catch(handleSyncFailure);
}

// Replaces the working copy with the gist's newer list.
function applyRemote(payload) {
  var s = sync.settings;
  state.library = payload.library;
  writeLocalLibrary(state.library);
  s.lastLocalChangeAt = payload.updatedAt;
  s.lastSyncedAt = payload.updatedAt;
  saveSyncSettings(s);
  setSyncStatus('synced');
  return refreshAfterLibraryChange().then(rerenderAfterSync);
}

function handleSyncFailure(err) {
  var code = err && err.code ? err.code : 'server';
  if (code === 'ratelimit') {
    sync.retryAt = err.retryAt;
    scheduleRetry();
  }
  setSyncError(code);
}

function scheduleRetry() {
  clearTimeout(sync.timer);
  sync.timer = setTimeout(syncNow, Math.max(1000, sync.retryAt - Date.now()));
}

function setSyncStatus(status) {
  sync.status = status;
  if (status !== 'error' && status !== 'offline') sync.errorCode = '';
  if (status === 'synced') sync.retryAt = 0;
  onSyncStateChanged();
}

function setSyncError(code) {
  sync.errorCode = code;
  sync.status = code === 'offline' ? 'offline' : 'error';
  onSyncStateChanged();
}

// Becomes the connected state after Setup or Change token.
function connect(settings) {
  sync.settings = settings;
  sync.errorCode = '';
  sync.retryAt = 0;
  sync.status = 'synced';
  saveSyncSettings(settings);
}

// Disconnect (SYN-6): this device only; the gist is untouched.
function disconnect() {
  clearTimeout(sync.timer);
  clearLocalData();
  sync.settings = null;
  sync.errorCode = '';
  sync.status = 'synced';
  state.library = [];
  state.computed = {};
  state.failed = {};
  state.setup = freshSetupState();
  state.view = 'setup';
  render();
}

// ---------------------------------------------------------------------
// 7. Rendering
// ---------------------------------------------------------------------

function freshSetupState() {
  return { token: '', busy: false, error: '', choices: null, choiceId: null, invalidFound: false };
}

var state = {
  view: 'loading', // setup | loading | list | add | detail | settings | sync | backup | importreport
  library: [],
  computed: {},     // showId -> { show, episodes, status }
  failed: {},       // showId -> 'temporary' | 'gone' (LOAD-3); never stored
  loading: {},      // showId -> true while its TVmaze data is being fetched (LOAD-8)
  failedScreen: { busy: false, error: '' }, // LOAD-6 Retry state
  segment: 'watching',
  listQuery: '',
  justAddedShowId: null, // ADD-5: row highlighted after adding
  addFlow: null,
  detailShowId: null,
  notices: [],      // MSG-1: messages above the list, each dismissed by the user
  saveFailed: false, // MSG-1: the last save on this device failed
  importReport: null, // SET-4 result shown after a V1 import
  setup: freshSetupState(),
  syncUi: { changingToken: false, token: '', busy: false, message: '' }
};

var root = document.getElementById('app');

function render() {
  renderToolbar();
  if (state.view === 'setup') return renderSetup();
  if (state.view === 'loading') return renderLoading();
  if (state.view === 'add') return renderAdd();
  if (state.view === 'detail') return renderDetail();
  if (state.view === 'settings') return renderSettings();
  if (state.view === 'sync') return renderSync();
  if (state.view === 'backup') return renderBackup();
  if (state.view === 'importreport') return renderImportReport();
  return renderList();
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function stripHtml(html) {
  if (!html) return '';
  var div = document.createElement('div');
  div.innerHTML = html;
  return div.textContent || div.innerText || '';
}

function formatDate(airdate) {
  var d = new Date(airdate + 'T00:00:00');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

// --- Setup (SYN-1..4, mockups 5.11, 5.13, 5.15) ---------------------------

function renderSetup() {
  var su = state.setup;
  var html = '<div class="app-header"><div><span class="wordmark">My Shows</span>' + versionLineHtml() + '</div></div>';

  if (su.choices) {
    html += screenTitleHtml('Choose your list', false);
    html += '<p class="hint" style="font-size:14px;color:var(--text-secondary);">More than one My Shows list was found in your GitHub account. Choose the one to use.</p>';
    su.choices.forEach(function (c) {
      var count = c.payload.library.length;
      html += '<label class="choice"><input type="radio" name="gist-choice" value="' + escapeHtml(c.id) + '"' + (su.choiceId === c.id ? ' checked' : '') + ' />' +
        '<span>' + count + ' show' + (count === 1 ? '' : 's') + ' · updated ' + escapeHtml(formatDate(c.payload.updatedAt.slice(0, 10))) +
        '<br><span class="row-sub">gist ' + escapeHtml(c.id.slice(0, 8)) + '…</span></span></label>';
    });
    html += '<p class="hint" style="margin-bottom:12px;">The others are left unchanged.</p>';
    html += '<button class="primary" id="use-choice-btn"' + (su.choiceId && !su.busy ? '' : ' disabled') + '>' + (su.busy ? 'Loading…' : 'Use this list') + '</button>';
    root.innerHTML = html;
    document.querySelectorAll('input[name="gist-choice"]').forEach(function (r) {
      r.onchange = function () { su.choiceId = r.value; renderSetup(); };
    });
    document.getElementById('use-choice-btn').onclick = useChosenGist;
    return;
  }

  html += screenTitleHtml('Welcome', false);
  html += '<p style="font-size:15px;line-height:1.6;margin:0 0 20px;">My Shows keeps your list in your own GitHub Gist so it’s the same on all your devices. Connect with a GitHub token to get started.</p>';
  html += '<div class="field"><p class="field-label">Personal access token (classic, gist scope)</p>' +
    '<input type="password" id="token-input" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + escapeHtml(su.token) + '" />' +
    '<p class="hint">Paste it from your password manager or Notes. It is stored only on this device.</p></div>';
  html += '<p style="margin:0 0 20px;"><a class="text-link" href="' + TOKEN_HELP_URL + '" target="_blank" rel="noopener">How to get a token ▸</a></p>';

  if (su.invalidFound) {
    html += '<p class="error-text">Your My Shows gist contains a file that isn’t a valid list. It was not changed.</p>';
    html += '<button class="primary" id="start-new-btn" style="margin-top:12px;"' + (su.busy ? ' disabled' : '') + '>' + (su.busy ? 'Creating…' : 'Start a new gist') + '</button>';
  } else {
    html += '<button class="primary" id="connect-btn"' + (su.busy ? ' disabled' : '') + '>' + (su.busy ? 'Connecting…' : 'Connect') + '</button>';
    if (su.error) html += '<p class="error-text" style="margin-top:12px;">⚠ ' + escapeHtml(su.error) + '</p>';
  }
  root.innerHTML = html;

  document.getElementById('token-input').oninput = function (e) {
    su.token = e.target.value;
    if (su.invalidFound) { su.invalidFound = false; renderSetup(); document.getElementById('token-input').focus(); }
  };
  var connectBtn = document.getElementById('connect-btn');
  if (connectBtn) connectBtn.onclick = connectFromSetup;
  var startNew = document.getElementById('start-new-btn');
  if (startNew) startNew.onclick = function () { createAndConnect(su.token.trim()); };
}

// Text for a failure during Setup or Change token.
function setupErrorText(err) {
  var code = err && err.code;
  if (code === 'token' || code === 'scope') return 'Token not valid or missing the gist scope.';
  if (code === 'offline') return 'Couldn’t reach GitHub. Check your connection and try again.';
  if (code === 'ratelimit') return 'GitHub’s rate limit was reached. Try again in a few minutes.';
  return 'GitHub returned an error' + (err && err.status ? ' (' + err.status + ')' : '') + '. Try again.';
}

// Connect: check the token, then find or create the My Shows gist (SYN-4).
function connectFromSetup() {
  var su = state.setup;
  var token = su.token.trim();
  if (!token) { su.error = 'Enter your token.'; renderSetup(); return; }
  su.busy = true; su.error = '';
  renderSetup();
  checkToken(token)
    .then(function () { return listCandidateGistIds(token); })
    .then(function (ids) {
      if (ids.length === 0) return createAndConnect(token);
      return Promise.all(ids.map(function (id) { return readGist(token, id); })).then(function (candidates) {
        var found = classifyCandidates(candidates);
        su.busy = false;
        if (found.valid.length === 1) return finishConnect(token, found.valid[0].id, found.valid[0].payload);
        if (found.valid.length > 1) {
          su.choices = found.valid;
          su.choiceId = null;
          renderSetup();
          return;
        }
        su.invalidFound = true;
        renderSetup();
      });
    })
    .catch(function (err) {
      su.busy = false;
      su.error = setupErrorText(err);
      renderSetup();
    });
}

function useChosenGist() {
  var su = state.setup;
  var choice = (su.choices || []).find(function (c) { return c.id === su.choiceId; });
  if (!choice) return;
  finishConnect(su.token.trim(), choice.id, choice.payload);
}

// First device, or "Start a new gist": a new secret gist with an empty list.
function createAndConnect(token) {
  var su = state.setup;
  su.busy = true; su.error = '';
  renderSetup();
  var payload = wrapPayload([], nextTimestamp(Date.now(), null));
  return createGist(token, payload).then(function (gistId) {
    return finishConnect(token, gistId, payload);
  }).catch(function (err) {
    su.busy = false;
    su.error = setupErrorText(err);
    su.invalidFound = false;
    renderSetup();
  });
}

// Stores the connection and loads the chosen list.
function finishConnect(token, gistId, payload) {
  connect({ gistId: gistId, token: token, lastSyncedAt: payload.updatedAt, lastLocalChangeAt: payload.updatedAt });
  state.setup = freshSetupState();
  state.library = payload.library;
  state.computed = {};
  state.failed = {};
  writeLocalLibrary(state.library);
  state.segment = 'watching';
  state.view = 'list';
  render();
  return refreshComputedFor(state.library);
}

// --- Main display (LIST, SRCH) --------------------------------------------

// Library items joined with their computed data, archive override applied.
function currentEntries() {
  return state.library.map(function (item) {
    var c = state.computed[item.showId];
    if (!c) return null;
    return { item: item, show: c.show, status: withArchiveOverride(c.status, item.archived), availableOrder: item.availableOrder || 0 };
  }).filter(Boolean);
}

var EMPTY_TEXT = {
  watching: 'Nothing to watch right now.<br>Shows move here when a new episode airs.',
  waiting: 'No shows waiting.<br>Shows you’re caught up on that are still in production appear here, along with any you suspend.',
  done: 'No finished shows yet.<br>Shows move here once the series has ended and you’ve watched every episode.'
};

// LIST-15: link to the README on GitHub, shown at the bottom of the main

var ABOUT_LINK_HTML = '<a class="about-link" id="about-link" href="' + README_URL + '" target="_blank" rel="noopener">About My Shows &amp; how to use</a>';

function renderList() {

  html += '<div id="list-body"></div>';
